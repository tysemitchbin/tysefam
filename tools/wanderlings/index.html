<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#fdf6ec">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Wanderlings</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🥚</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="styles.css">
  <script src="../../site.js"></script>
</head>
<body>
  <header class="top">
    <h1>Wanderlings</h1>
    <div class="top-actions">
      <a class="icon-btn" href="../../" aria-label="Tyse Fam home" title="Tyse Fam home">🏔️</a>
      <button id="sync" class="icon-btn" data-action="sync" aria-label="Sync walks">↻</button>
      <button class="icon-btn" data-action="settings" aria-label="Settings">⚙</button>
    </div>
  </header>

  <div id="switcher" class="switcher" hidden></div>
  <div id="demo-banner" class="demo-banner" hidden>Demo walks shown. <button class="link" data-action="settings">Connect Ride with GPS</button></div>

  <main>
    <section id="view-home" class="view"></section>
    <section id="view-garden" class="view" hidden>
      <div id="garden" class="garden"></div>
      <div id="garden-info"></div>
    </section>
    <section id="view-map" class="view" hidden>
      <div id="map"></div>
      <div id="map-info"></div>
    </section>
    <section id="view-dex" class="view" hidden></section>
    <section id="view-walks" class="view" hidden></section>
  </main>

  <nav class="tabs">
    <button class="tab" data-tab="home"><span>🏠</span>Home<b id="egg-count" class="badge" hidden></b></button>
    <button class="tab" data-tab="garden"><span>🌷</span>Garden</button>
    <button class="tab" data-tab="map"><span>🗺️</span>Map</button>
    <button class="tab" data-tab="dex"><span>📖</span>Creatures</button>
    <button class="tab" data-tab="walks"><span>👣</span>Walks</button>
  </nav>

  <div id="sheet" class="sheet-backdrop" hidden>
    <div class="sheet" role="dialog" aria-modal="true">
      <button class="sheet-close" data-action="close" aria-label="Close">×</button>
      <div id="sheet-body"></div>
    </div>
  </div>
  <div id="toast" class="toast" role="status"></div>

  <section id="signin" class="signin" hidden>
    <form class="signin-card" autocomplete="on">
      <div class="signin-egg">🥚</div>
      <h2>Wanderlings</h2>
      <p class="muted">Walks hatch eggs. Eggs hatch friends.</p>
      <label for="signin-email">Email</label>
      <input id="signin-email" name="email" type="email" required autocomplete="email" inputmode="email" placeholder="you@example.com">
      <label for="signin-password">Password</label>
      <input id="signin-password" name="password" type="password" required minlength="6" autocomplete="current-password">
      <p class="signin-hint muted small" hidden>Pick any password (6+ characters). Your phone can remember it.</p>
      <button class="btn" type="submit">Sign in</button>
      <button class="link signin-toggle" type="button"></button>
      <p class="signin-msg" role="alert"></p>
    </form>
  </section>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script type="module" src="app.js"></script>
</body>
</html>
