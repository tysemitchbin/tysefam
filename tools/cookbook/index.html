<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Cookbook</title>

<!-- ════════════════════════════════════════════════════════════════
     COOKBOOK: the family's recipe collection, shown as a bookshelf.

     Pages (the part of the address after #):
       (nothing)          the bookshelf: one book per category (pick what the shelf is arranged by)
       #b=cuisine:italian one book opened: its recipes stand on a shelf as little books between bookends
                          (also #b=all, #b=fav, #b=recent)
       #r=<id>            one recipe, with "when we make it" stats
       #cal=2026-11       the cooking calendar: what we made each day

     Add a recipe by pasting either
       • a link to a recipe page  → the `recipes` edge function (supabase/functions/recipes/)
                                     fetches the page and reads the recipe out of it, or
       • the whole recipe text     → read right here by guess.js.
     guess.js then sorts it (meal, main protein, cuisine, time, difficulty, cost, labels) and
     the edit box opens so the guesses can be checked before saving.

     Saved in Family.store('cookbook'):
       recipes → { title, source, image, description, servings, prepMin, cookMin, totalMin,
                   ingredients: [lines], steps: [lines], notes,
                   meal, protein, cuisine, difficulty, cost   (ids from Cook.CATS in guess.js),
                   tags: ['Vegetarian', …], favs: { Mitch: true },
                   cooked: [{ by, date: '2026-11-24', ts }]   (every time we made it), ts, by }
     A line ending in ":" in ingredients or steps ("For the sauce:") is shown as a little heading.
     How the shelf is arranged, search and ticked-off ingredients stay on this device only.
═════════════════════════════════════════════════════════════════ -->

<link rel="stylesheet" href="../../shared/family.css">
<style>
textarea.field{width:100%;resize:vertical;line-height:1.4;}
.acts{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:10px;}
.msg{font-weight:700;font-size:.9rem;color:var(--ink-soft);}
.msg.bad{color:var(--peach-deep);}
.linkbtn{border:none;background:none;color:var(--meadow-deep);font-weight:800;text-decoration:underline;padding:4px;}

/* tabs under the title */
.tabs{display:flex;gap:6px;margin:-6px 0 16px;flex-wrap:wrap;}
.tab{padding:8px 14px;border-radius:999px;font-weight:800;font-size:.92rem;text-decoration:none;color:var(--forest);background:#fff;border:2px solid var(--line);}
.tab.on{background:var(--forest);border-color:var(--forest);color:#fff;}

/* "arrange the shelf by" chips */
.arrange{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin:0 0 12px;scrollbar-width:thin;}
.arrange .lbl{font-weight:800;color:var(--ink-soft);font-size:.85rem;align-self:center;white-space:nowrap;}
.chipbtn{border:2px solid var(--line);background:#fff;color:var(--forest);border-radius:999px;padding:6px 12px;font-weight:800;font-size:.85rem;white-space:nowrap;}
.chipbtn.on{background:var(--meadow);border-color:var(--meadow);color:#fff;}
.chipbtn.pink.on{background:var(--blossom-deep);border-color:var(--blossom-deep);}
.searchrow{display:flex;gap:8px;margin-bottom:12px;}
.searchrow input{flex:1;min-width:0;border:2px solid var(--line);background:#fff;border-radius:12px;padding:10px 12px;outline:none;}
.searchrow input:focus{border-color:var(--meadow);}
.sortsel{border:2px solid var(--line);background:#fff;border-radius:12px;padding:8px 10px;font-size:.9rem;font-weight:700;color:var(--forest);}

/* ───── the bookcase ─────
   Every book stands in a .slot exactly one shelf tall, so the rows of books line up
   with the wooden boards drawn by the background. */
.bookcase{--row:210px;--board:16px;display:flex;flex-wrap:wrap;align-items:flex-end;padding:0 10px;margin-bottom:18px;
  border:10px solid #8a5a35;border-top-width:14px;border-radius:12px;
  background:
    repeating-linear-gradient(to bottom, transparent 0 calc(var(--row) - var(--board)),
      #b07b4c calc(var(--row) - var(--board)), #94633c calc(var(--row) - 5px), #6e4528 calc(var(--row) - 5px) var(--row)),
    linear-gradient(90deg, rgba(0,0,0,.06), transparent 6%, transparent 94%, rgba(0,0,0,.06)),
    #f0dfc0;
  box-shadow:inset 0 8px 16px rgba(60,35,15,.18), var(--shadow);}
.slot{height:var(--row);display:flex;align-items:flex-end;padding-bottom:var(--board);}
.shelf-empty{height:var(--row);padding:24px 10px var(--board);display:flex;align-items:center;justify-content:center;width:100%;
  color:#7a5a3a;font-weight:700;text-align:center;}

.book{position:relative;display:flex;flex-direction:column;align-items:center;gap:4px;
  width:var(--w);height:var(--h);margin:0 1px;padding:8px 3px 7px;border-radius:4px 4px 2px 2px;
  background:linear-gradient(90deg, rgba(0,0,0,.22), rgba(255,255,255,.16) 14%, rgba(255,255,255,0) 38%, rgba(0,0,0,.08) 86%, rgba(0,0,0,.28)), var(--c);
  color:#fdf6e3;text-decoration:none;box-shadow:1px 0 2px rgba(0,0,0,.3);transition:transform .15s;}
.book:hover,.book:focus-visible{transform:translateY(-10px);outline:none;}
.book::before,.book::after{content:"";position:absolute;left:0;right:0;height:3px;background:rgba(255,231,160,.6);}
.book::before{top:34px;} .book::after{bottom:30px;}
.b-top{font-size:1.15rem;line-height:1;height:22px;}
.b-title{writing-mode:vertical-rl;flex:1;min-height:0;overflow:hidden;font-family:'Fredoka',sans-serif;font-weight:600;
  font-size:.86rem;line-height:1.12;text-align:center;padding:8px 0 6px;text-shadow:0 1px 1px rgba(0,0,0,.3);}
.b-n{font-size:.68rem;font-weight:800;background:rgba(255,253,247,.92);color:var(--ink);border-radius:999px;padding:1px 6px;min-width:20px;text-align:center;}
.book.special::before,.book.special::after{background:#e9c46a;}
.book.rbook .b-title{font-size:.78rem;}
.book.rbook .b-n{background:transparent;color:#fdf6e3;padding:0;font-size:.72rem;}
/* a book leaning on the last one, just for looks */
.slot.lean .book{transform:rotate(7deg);transform-origin:bottom left;margin-left:2px;margin-right:22px;}
.slot.lean .book:hover{transform:rotate(7deg) translateY(-10px);}

/* bookends at both ends of an opened book's shelf */
.bookend{width:44px;height:118px;margin:0 3px;display:flex;align-items:flex-start;justify-content:center;padding-top:14px;
  font-size:1.3rem;background:linear-gradient(180deg,#7a4f2e,#5a3820);box-shadow:inset 0 2px 0 rgba(255,255,255,.15),0 2px 4px rgba(0,0,0,.3);}
.bookend.left{border-radius:44px 4px 0 0;}
.bookend.right{border-radius:4px 44px 0 0;}

.bookhead{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px;}
.bookhead h2{margin:0;color:var(--forest);font-size:1.4rem;}
.bookhead .n{color:var(--ink-soft);font-weight:800;font-size:.9rem;}

/* one recipe */
.rv-top{display:flex;gap:8px;align-items:center;margin-bottom:12px;}
.rv-head{padding:0;overflow:hidden;}
.hero{width:100%;max-height:340px;object-fit:cover;display:block;}
.rv-in{padding:18px;}
.rv-in h1{margin:0 0 6px;font-size:1.7rem;color:var(--forest);line-height:1.15;}
.rv-desc{color:var(--ink-soft);margin:0 0 12px;line-height:1.45;}
.facts{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0;}
.fact{border:none;font:inherit;font-size:.82rem;font-weight:800;padding:5px 11px;border-radius:999px;background:#e3f1df;color:var(--meadow-deep);text-decoration:none;}
a.fact:hover{filter:brightness(.95);}
.fact.c-cost{background:#fdf3d6;color:#9a7a17;} .fact.c-difficulty{background:#fde9dc;color:#b86a3c;}
.fact.c-cuisine{background:#e2f1f4;color:#3f7f8f;} .fact.c-tag{background:#fbe4ea;color:#b4566f;}
.times{font-size:.85rem;color:var(--ink-soft);font-weight:700;margin:4px 0 8px;}
.who-line{font-size:.82rem;color:var(--ink-soft);font-weight:700;}
.logrow{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:10px;padding:10px;background:#eef6ea;border-radius:12px;font-weight:700;}
.logrow input{border:2px solid var(--line);border-radius:10px;padding:7px 9px;}
.rv-grid{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,3fr);gap:18px;align-items:start;margin-bottom:18px;}
.rv-grid .card{margin:0;}
@media(max-width:760px){.rv-grid{grid-template-columns:1fr;}}
.serv{display:flex;align-items:center;gap:8px;font-weight:800;color:var(--forest);margin-bottom:8px;}
.serv button{width:32px;height:32px;border-radius:50%;border:2px solid var(--line);background:#fff;font-weight:800;color:var(--forest);}
.serv button:hover{border-color:var(--meadow);}
.mini{font-size:.7rem;font-weight:800;padding:2px 7px;border-radius:999px;background:#eef0e8;color:var(--ink-soft);white-space:nowrap;}
.ing{display:flex;gap:10px;align-items:flex-start;padding:8px 2px;border-bottom:1px dashed var(--line);cursor:pointer;line-height:1.35;}
.ing:last-child{border-bottom:none;}
.ing.done .t{text-decoration:line-through;color:var(--ink-soft);}
.sub{font-family:'Fredoka',sans-serif;font-weight:600;color:var(--forest);margin:12px 0 2px;}
ol.steps{list-style:none;margin:0;padding:0;counter-reset:s;}
ol.steps li.step{counter-increment:s;display:flex;gap:12px;padding:10px 6px;border-radius:12px;line-height:1.5;cursor:pointer;}
ol.steps li.step::before{content:counter(s);flex:0 0 28px;height:28px;border-radius:50%;background:var(--meadow);color:#fff;
  font-weight:800;display:grid;place-items:center;font-size:.9rem;}
ol.steps li.step.done{color:var(--ink-soft);}
ol.steps li.step.done::before{content:"✓";background:#c9d9c3;}
ol.steps li.step:hover{background:#f6faf3;}
.notes{white-space:pre-wrap;line-height:1.45;}

/* "when we make it" stats */
.stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px;margin-bottom:12px;}
.stat{background:#f6faf3;border-radius:14px;padding:10px 12px;}
.stat b{display:block;font-family:'Fredoka',sans-serif;font-size:1.25rem;color:var(--forest);font-weight:600;line-height:1.2;}
.stat span{font-size:.78rem;font-weight:700;color:var(--ink-soft);}
.bars{display:flex;align-items:flex-end;gap:4px;height:70px;margin:6px 0 2px;}
.bars div{flex:1;background:var(--meadow);border-radius:4px 4px 0 0;min-height:2px;}
.bars div.zero{background:#e6ece1;}
.barlbl{display:flex;gap:4px;font-size:.66rem;font-weight:800;color:var(--ink-soft);}
.barlbl span{flex:1;text-align:center;}
.statline{font-weight:700;color:var(--ink);margin:4px 0;line-height:1.4;}
details.hist{margin-top:10px;}
details.hist summary{cursor:pointer;font-weight:800;color:var(--meadow-deep);}
.histrow{display:flex;align-items:center;gap:8px;padding:5px 2px;border-bottom:1px dashed var(--line);font-weight:700;font-size:.9rem;}

/* the cooking calendar */
.calhead{display:flex;align-items:center;gap:10px;margin-bottom:10px;}
.calhead h2{margin:0;flex:1;text-align:center;color:var(--forest);}
.calhead button{width:40px;height:40px;border-radius:50%;border:2px solid var(--line);background:#fff;font-weight:800;font-size:1.1rem;color:var(--forest);}
.calgrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;}
.calgrid .wd{text-align:center;font-weight:800;font-size:.75rem;color:var(--ink-soft);padding:2px 0;}
.day{min-height:78px;background:#fff;border:1px solid var(--line);border-radius:10px;padding:4px;display:flex;flex-direction:column;gap:2px;overflow:hidden;}
.day.blank{background:transparent;border:none;}
.day.today{border:2px solid var(--meadow);}
.day .d{font-weight:800;font-size:.75rem;color:var(--ink-soft);}
.day.has{background:#f6faf3;}
.ce{display:block;font-size:.7rem;font-weight:700;color:var(--forest);text-decoration:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  background:#e3f1df;border-radius:6px;padding:1px 4px;}
.ce:hover{background:#d4ead0;}
.more{font-size:.68rem;font-weight:800;color:var(--ink-soft);}
/* on a phone the days are too narrow for names: just the little pictures (the list below has the names) */
@media(max-width:520px){.day{min-height:58px;padding:3px;}.ce{font-size:.85rem;padding:0;background:none;text-align:center;}.ce .t{display:none;}}
.calrow{display:flex;gap:10px;align-items:center;padding:8px 2px;border-bottom:1px dashed var(--line);}
.calrow:last-child{border-bottom:none;}
.calrow .dt{flex:0 0 92px;font-weight:800;color:var(--ink-soft);font-size:.85rem;}
.calrow a{font-weight:700;color:var(--forest);text-decoration:none;flex:1;min-width:0;}

/* the edit box */
dialog{border:none;border-radius:20px;padding:0;max-width:680px;width:calc(100% - 16px);max-height:94vh;box-shadow:var(--shadow-lg);background:var(--paper);color:var(--ink);}
dialog::backdrop{background:rgba(60,65,56,.35);}
dialog form{padding:18px;display:flex;flex-direction:column;gap:12px;}
dialog h3{margin:0;color:var(--forest);}
dialog label{font-weight:800;font-size:.82rem;color:var(--ink-soft);display:flex;flex-direction:column;gap:5px;}
dialog .field{width:100%;}
.guessnote{background:#fdf3d6;border-radius:12px;padding:10px 12px;margin:0;font-weight:700;font-size:.9rem;color:#7d6414;}
.guessnote.bad{background:#fde9dc;color:#a35a30;}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.row4{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;}
.cats{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px;}
@media(max-width:520px){.row2{grid-template-columns:1fr;}.row4{grid-template-columns:1fr 1fr;}}
.taglist{display:flex;flex-wrap:wrap;gap:6px 12px;}
.taglist label{flex-direction:row;align-items:center;gap:6px;font-size:.9rem;color:var(--ink);font-weight:700;}
.dlg-acts{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;position:sticky;bottom:-18px;background:var(--paper);padding:10px 0 4px;}
.dlg-acts .danger{background:#fff;color:var(--blossom-deep);border:2px solid #f6d3de;margin-right:auto;}
</style>
</head>
<body data-tool="cookbook">

<main class="wrap">
  <div class="page-head">
    <span class="emoji">📖</span><h1>Cookbook</h1>
    <span style="flex:1"></span>
    <span id="sync" class="badge local">…</span>
  </div>
  <nav class="tabs">
    <a class="tab" id="tabShelf" href="#">📚 Bookshelf</a>
    <a class="tab" id="tabCal" href="#cal">📅 What we’ve cooked</a>
  </nav>

  <!-- ───── the bookshelf ───── -->
  <section id="shelfView">
    <div class="card">
      <h3>➕ Add a recipe</h3>
      <textarea id="paste" class="field" rows="2" placeholder="Paste a link (https://…) or a whole recipe: name, ingredients and steps"></textarea>
      <div class="acts">
        <button class="btn" id="addBtn">Add to cookbook</button>
        <button class="btn ghost" id="blankBtn">✍️ Type one in</button>
        <span class="msg" id="addMsg"></span>
      </div>
    </div>

    <div class="searchrow">
      <input id="q" placeholder="🔍 Search recipes or ingredients" autocomplete="off">
      <button class="btn sky" id="surprise" title="Pick a random recipe">🎲</button>
    </div>
    <div class="arrange" id="arrange"></div>
    <div id="shelf"></div>
  </section>

  <!-- ───── one book opened (filled in by showBook) ───── -->
  <section id="bookView" hidden></section>

  <!-- ───── one recipe (filled in by showRecipe) ───── -->
  <section id="recipeView" hidden></section>

  <!-- ───── the cooking calendar (filled in by showCalendar) ───── -->
  <section id="calView" hidden></section>
</main>

<!-- ───── add / edit a recipe ───── -->
<dialog id="ed">
  <form id="edForm">
    <h3 id="edHead">📝 New recipe</h3>
    <p class="guessnote" id="edNote" hidden></p>
    <label>Name<input class="field" name="title" required maxlength="140"></label>
    <div class="row2">
      <label>Link to the original<input class="field" name="source" placeholder="https://…" maxlength="600"></label>
      <label>Picture link<input class="field" name="image" placeholder="https://…" maxlength="1000"></label>
    </div>
    <div class="row4">
      <label>Serves<input class="field" name="servings" placeholder="4" maxlength="40"></label>
      <label>Prep (min)<input class="field" name="prepMin" type="number" min="0" max="5000"></label>
      <label>Cook (min)<input class="field" name="cookMin" type="number" min="0" max="5000"></label>
      <label>Total (min)<input class="field" name="totalMin" type="number" min="0" max="5000"></label>
    </div>
    <div class="cats" id="edCats"></div>
    <div>
      <div style="font-weight:800;font-size:.82rem;color:var(--ink-soft);margin-bottom:6px">Labels</div>
      <div class="taglist" id="edTags"></div>
      <div class="addrow" style="margin:8px 0 0">
        <input id="edNewTag" placeholder="Add your own label (e.g. Mormor’s)" maxlength="30">
        <button type="button" class="btn ghost sm" id="edAddTag">Add</button>
      </div>
    </div>
    <label>Ingredients, one per line<textarea class="field" name="ingredients" rows="8" placeholder="2 cups flour&#10;1 tsp salt&#10;For the sauce:&#10;…"></textarea></label>
    <label>Steps, one per line<textarea class="field" name="steps" rows="8"></textarea></label>
    <label>About it (optional)<textarea class="field" name="description" rows="2" maxlength="800"></textarea></label>
    <label>Our notes (optional)<textarea class="field" name="notes" rows="3" placeholder="Less chilli for the little one, doubles well…"></textarea></label>
    <div class="dlg-acts">
      <button type="button" class="btn danger" id="edDel" hidden>🗑 Delete</button>
      <button type="button" class="btn ghost" id="edGuess" title="Sort it again from the ingredients and steps above">✨ Guess again</button>
      <button type="button" class="btn ghost" id="edCancel">Cancel</button>
      <button type="submit" class="btn">Save</button>
    </div>
  </form>
</dialog>

<script src="../../site.js"></script>
<script src="../../shared/family.js"></script>
<script src="guess.js"></script>
<script>
const TOOL_ID = 'cookbook';
const store = Family.store(TOOL_ID);
const $ = s => document.querySelector(s);
const esc = Family.esc;
const CATS = Cook.CATS;
const CAT_KEYS = ['meal', 'protein', 'cuisine', 'time', 'difficulty', 'cost'];
// The ways the shelf can be arranged (each one fills the shelf with different books).
const ARRANGE = [['meal', '🍽️ Meal'], ['protein', '🥩 Protein'], ['cuisine', '🌍 Cuisine'], ['time', '⏱️ Time'],
  ['difficulty', '📶 Difficulty'], ['cost', '💰 Cost'], ['tag', '🏷️ Labels']];
// Spine colours: old cloth-bound book colours that work with cream text.
const SPINES = ['#a4493d', '#3f6e8c', '#4f7a4f', '#b5832f', '#7d4f86', '#3e7a74', '#9a5a32', '#56609e',
  '#8e3f57', '#5f7a35', '#b46a4c', '#35566b', '#8a6d2f', '#6a4a7a'];

let recipes = {};        // id → recipe, kept up to date live
let loaded = false;
let wake = null;         // the "keep screen on" lock while cooking

/* ───────── small helpers ───────── */
const safeUrl = u => (/^https?:\/\/[^\s"'<>]+$/i.test(String(u || '').trim()) ? String(u).trim() : '');
const timeOf = r => r.totalMin || ((r.prepMin || 0) + (r.cookMin || 0)) || 0;
function fmtMin(m) {
  if (!m) return '';
  if (m < 60) return m + ' min';
  const h = Math.floor(m / 60), rest = m % 60;
  return rest ? `${h} h ${rest} min` : `${h} h`;
}
const shortMin = m => !m ? '' : m < 60 ? m + 'm' : Math.floor(m / 60) + 'h' + (m % 60 ? pad(m % 60) : '');
const domain = u => { try { return new URL(u).hostname.replace(/^www\./, ''); } catch (e) { return ''; } };
// The same recipe link written slightly differently (tracking bits, trailing slash) counts as the same.
const sameLink = u => String(u || '').toLowerCase().replace(/[?#].*$/, '').replace(/^https?:\/\/(www\.)?/, '').replace(/\/+$/, '');
// What a recipe is, for one category: 'chicken' for protein; the time group for time.
const valueOf = (r, cat) => cat === 'time' ? Cook.timeBucket(timeOf(r)) : r[cat] || '';
const allTags = () => {
  const set = new Set(Cook.TAGS);
  Object.values(recipes).forEach(r => (r.tags || []).forEach(t => set.add(t)));
  return [...set];
};
// A number from some text, always the same for the same text (so each book keeps its colour and height).
function hash(text) { let h = 7; for (const ch of String(text)) h = (h * 31 + ch.codePointAt(0)) >>> 0; return h; }

/* Dates: a day is kept as '2026-11-24' (the day it was cooked where we are). */
const pad = n => String(n).padStart(2, '0');
const dayKey = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const keyDate = k => new Date(k + 'T12:00:00');
const todayKey = () => dayKey(new Date());
const cookedDay = c => c.date || dayKey(new Date(c.ts));
const fmtDay = k => keyDate(k).toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: keyDate(k).getFullYear() === new Date().getFullYear() ? undefined : 'numeric' });
const daysBetween = (a, b) => Math.round((keyDate(b) - keyDate(a)) / 864e5);
const MONTH_NAMES = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
const MONTHS = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
const WEEKDAYS = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
const lastCooked = r => (r.cooked || []).map(cookedDay).sort().pop() || '';

/* ───────── settings remembered on this device ───────── */
const F = Object.assign({ q: '', shelf: 'meal', sort: 'new' },
  (() => { try { return JSON.parse(localStorage.getItem('cookbook:view')) || {}; } catch (e) { return {}; } })());
const saveView = () => { try { localStorage.setItem('cookbook:view', JSON.stringify(F)); } catch (e) { /* private window */ } };

function searchMatch(r, q) {
  const hay = [r.title, r.description, r.notes, ...(r.ingredients || []), ...(r.tags || []),
    ...['meal', 'protein', 'cuisine'].map(k => Cook.find(k, r[k])?.label)].join(' ').toLowerCase();
  return q.toLowerCase().split(/\s+/).filter(Boolean).every(w => hay.includes(w));
}
const SORTS = {
  new: (a, b) => (b[1].ts || 0) - (a[1].ts || 0),
  az: (a, b) => (a[1].title || '').localeCompare(b[1].title || ''),
  quick: (a, b) => (timeOf(a[1]) || 9999) - (timeOf(b[1]) || 9999),
  cooked: (a, b) => (b[1].cooked || []).length - (a[1].cooked || []).length || SORTS.az(a, b),
  recent: (a, b) => lastCooked(b[1]).localeCompare(lastCooked(a[1])) || SORTS.az(a, b),
};
const sortOptions = sel => [['new', 'Newest first'], ['az', 'A to Z'], ['quick', 'Quickest first'], ['cooked', 'Made most often'], ['recent', 'Made most recently']]
  .map(([v, l]) => `<option value="${v}"${sel === v ? ' selected' : ''}>${l}</option>`).join('');

/* ───────── books ───────── */
// A category book on the main shelf. key is what goes in the address: 'cuisine:italian', 'all', 'fav'…
// Colours go round the list 5 at a time, so every colour gets used and books side by side never match.
const spine = i => SPINES[(i * 5) % SPINES.length];
function categoryBook(key, emoji, label, count, special, i) {
  const h = 150 + hash(key) % 34, w = 50 + Math.min(count, 14) * 3;
  const c = special ? '#2f4a35' : spine(i);
  return `<div class="slot"><a class="book${special ? ' special' : ''}" href="#b=${encodeURIComponent(key)}"
      style="--h:${h}px;--w:${w}px;--c:${c}" aria-label="${esc(label)}, ${count} recipe${count === 1 ? '' : 's'}" title="${esc(label)}">
    <span class="b-top">${emoji}</span><span class="b-title">${esc(label)}</span><span class="b-n">${count}</span></a></div>`;
}
// A recipe standing on the shelf of an opened book.
function recipeBook(id, r, i) {
  const h = 152 + hash(id) % 30, w = 42 + Math.min((r.ingredients || []).length, 16) * 1.2;
  const c = spine(i + 3);
  const prot = Cook.find('protein', r.protein), meal = Cook.find('meal', r.meal);
  const emoji = (r.protein && !['none', 'veg'].includes(r.protein) ? prot?.emoji : meal?.emoji) || '🍽️';
  const fav = (r.favs || {})[Family.me()];
  return `<div class="slot"><a class="book rbook" href="#r=${encodeURIComponent(id)}" style="--h:${h}px;--w:${Math.round(w)}px;--c:${c}"
      title="${esc(r.title)}" aria-label="${esc(r.title)}">
    <span class="b-top">${emoji}</span><span class="b-title">${esc(r.title)}</span>
    <span class="b-n">${fav ? '❤️' : ''}${shortMin(timeOf(r))}</span></a></div>`;
}
function shelfOfRecipes(list, endEmoji, emptyText) {
  if (!list.length) return `<div class="bookcase small"><div class="shelf-empty">${emptyText}</div></div>`;
  return `<div class="bookcase small">
    <div class="slot"><div class="bookend left" aria-hidden="true">${endEmoji}</div></div>
    ${list.map(([id, r], i) => recipeBook(id, r, i)).join('')}
    <div class="slot"><div class="bookend right" aria-hidden="true">${endEmoji}</div></div>
  </div>`;
}

// What's in a book: [[id, recipe], …] for an address key like 'cuisine:italian'.
function bookContents(key) {
  const all = Object.entries(recipes);
  const me = Family.me();
  if (key === 'all') return { emoji: '📚', label: 'All recipes', list: all };
  if (key === 'fav') return { emoji: '❤️', label: `${me}’s favourites`, list: all.filter(([, r]) => (r.favs || {})[me]) };
  if (key === 'recent') return { emoji: '🕘', label: 'Made lately', list: all.filter(([, r]) => (r.cooked || []).length), sort: 'recent' };
  const [cat, ...rest] = key.split(':');
  const val = rest.join(':');
  if (cat === 'tag') return { emoji: '🏷️', label: val, list: all.filter(([, r]) => (r.tags || []).includes(val)) };
  if (!CATS[cat]) return null;
  if (val === '_none') return { emoji: '📦', label: `${CATS[cat].label}: not sorted`, list: all.filter(([, r]) => !valueOf(r, cat)) };
  const c = Cook.find(cat, val);
  return c ? { emoji: c.emoji, label: c.label, list: all.filter(([, r]) => valueOf(r, cat) === val) } : null;
}

/* ───────── the main bookshelf ───────── */
function showShelf() {
  $('#arrange').innerHTML = '<span class="lbl">Arrange by</span>' + ARRANGE.map(([k, l]) =>
    `<button class="chipbtn${F.shelf === k ? ' on' : ''}" data-k="${k}">${l}</button>`).join('');
  $('#arrange').querySelectorAll('button').forEach(b => b.onclick = () => { F.shelf = b.dataset.k; saveView(); showShelf(); });

  const box = $('#shelf');
  const all = Object.entries(recipes);
  if (!loaded) { box.innerHTML = `<div class="bookcase"><div class="shelf-empty">Dusting off the shelves…</div></div>`; return; }
  if (!all.length) {
    box.innerHTML = `<div class="bookcase"><div class="shelf-empty">🍳 The shelf is empty. Paste a link or a recipe above to put the first book on it.</div></div>`;
    return;
  }

  // Searching: the matching recipes stand on their own shelf.
  if (F.q.trim()) {
    const list = all.filter(([, r]) => searchMatch(r, F.q)).sort(SORTS.az);
    box.innerHTML = `<div class="bookhead"><span class="n">🔍 ${list.length} recipe${list.length === 1 ? '' : 's'} match “${esc(F.q.trim())}”</span>
      <button class="linkbtn" id="clearQ">Clear search</button></div>` +
      shelfOfRecipes(list, '🔍', 'Nothing matches. Try another word.');
    $('#clearQ').onclick = () => { F.q = ''; $('#q').value = ''; saveView(); showShelf(); };
    return;
  }

  const me = Family.me();
  const books = [categoryBook('all', '📚', 'All recipes', all.length, true)];
  const favs = all.filter(([, r]) => (r.favs || {})[me]).length;
  if (favs) books.push(categoryBook('fav', '❤️', 'My favourites', favs, true));
  const made = all.filter(([, r]) => (r.cooked || []).length).length;
  if (made) books.push(categoryBook('recent', '🕘', 'Made lately', made, true));

  if (F.shelf === 'tag') {
    allTags().forEach(t => {
      const n = all.filter(([, r]) => (r.tags || []).includes(t)).length;
      if (n) books.push(categoryBook('tag:' + t, '🏷️', t, n, false, books.length));
    });
  } else {
    CATS[F.shelf].items.forEach(([id, emoji, label]) => {
      const n = all.filter(([, r]) => valueOf(r, F.shelf) === id).length;
      if (n) books.push(categoryBook(F.shelf + ':' + id, emoji, label, n, false, books.length));
    });
    const none = all.filter(([, r]) => !valueOf(r, F.shelf)).length;
    if (none) books.push(categoryBook(F.shelf + ':_none', '📦', 'Not sorted', none, false, books.length));
  }
  // The last book leans over a little, like on a real shelf.
  if (books.length > 3) books[books.length - 1] = books[books.length - 1].replace('class="slot"', 'class="slot lean"');
  box.innerHTML = `<div class="bookcase">${books.join('')}</div>`;
}
$('#q').value = F.q;
$('#q').oninput = e => { F.q = e.target.value; saveView(); showShelf(); };
$('#surprise').onclick = () => {

/* ───────── "when we make it" ───────── */
function cookStats(r) {
  const days = (r.cooked || []).map(c => ({ day: cookedDay(c), by: c.by || '?' })).sort((a, b) => a.day.localeCompare(b.day));
  if (!days.length) return `<p class="statline">Not made yet. Tap <b>✅ We made this</b> above when you do, and this fills up.</p>`;
  const n = days.length, first = days[0].day, last = days[n - 1].day;
  const ago = daysBetween(last, todayKey());
  const agoText = ago <= 0 ? 'today' : ago === 1 ? 'yesterday' : ago < 60 ? `${ago} days ago` : `${Math.round(ago / 30)} months ago`;
  let every = '';
  if (n >= 2) {
    const gap = daysBetween(first, last) / (n - 1);
    every = gap < 1.5 ? 'every day or so' : gap < 13 ? `every ${Math.round(gap)} days` : gap < 60 ? `every ${Math.round(gap / 7)} weeks` : `every ${Math.round(gap / 30)} months`;
  }
  const year = String(new Date().getFullYear());
  const thisYear = days.filter(d => d.day.startsWith(year)).length;
  // Busiest weekday, if one stands out.
  const wd = [0, 0, 0, 0, 0, 0, 0];
  days.forEach(d => wd[keyDate(d.day).getDay()]++);
  const topWd = wd.indexOf(Math.max(...wd));
  const who = {};
  days.forEach(d => { who[d.by] = (who[d.by] || 0) + 1; });
  // The last 12 months, as little bars.
  const now = new Date();
  const months = [];
  for (let i = 11; i >= 0; i--) {
    const m = new Date(now.getFullYear(), now.getMonth() - i, 1);
    const prefix = `${m.getFullYear()}-${pad(m.getMonth() + 1)}`;
    months.push({ label: MONTHS[m.getMonth()][0], full: `${MONTHS[m.getMonth()]} ${m.getFullYear()}`, n: days.filter(d => d.day.startsWith(prefix)).length });
  }
  const most = Math.max(1, ...months.map(m => m.n));
  return `
    <div class="stats">
      <div class="stat"><b>${n}×</b><span>made in all</span></div>
      <div class="stat"><b>${esc(agoText)}</b><span>last time (${esc(fmtDay(last))})</span></div>
      <div class="stat"><b>${thisYear}×</b><span>this year</span></div>
      ${every ? `<div class="stat"><b>${esc(every)}</b><span>about how often</span></div>` : ''}
      <div class="stat"><b>${esc(fmtDay(first))}</b><span>first time</span></div>
    </div>
    ${n >= 3 && wd[topWd] >= 2 ? `<p class="statline">📆 Most often on a <b>${WEEKDAYS[topWd]}</b> (${wd[topWd]} of ${n} times).</p>` : ''}
    <p class="statline">👩‍🍳 Made by ${Object.entries(who).sort((a, b) => b[1] - a[1]).map(([p, c]) => `<b>${esc(p)}</b> ${c}×`).join(', ')}.</p>
    <div class="bars" aria-label="Times made each month, last 12 months">
      ${months.map(m => `<div class="${m.n ? '' : 'zero'}" style="height:${m.n ? Math.max(12, m.n / most * 100) : 3}%" title="${m.full}: ${m.n}×"></div>`).join('')}
    </div>
    <div class="barlbl">${months.map(m => `<span>${m.label}</span>`).join('')}</div>
    <details class="hist"><summary>Every time we made it (${n})</summary>
      ${(r.cooked || []).map((c, i) => [c, i]).sort((a, b) => cookedDay(b[0]).localeCompare(cookedDay(a[0]))).map(([c, i]) => `
        <div class="histrow"><span style="flex:1">${esc(fmtDay(cookedDay(c)))} · ${WEEKDAYS[keyDate(cookedDay(c)).getDay()]}</span>
          <span class="who-pill">${esc(c.by || '?')}</span><button class="del" data-uncook="${i}" title="Remove this one">✕</button></div>`).join('')}
    </details>`;
}

/* ───────── one recipe ───────── */
const ticks = {};        // recipe id → { i3: true, s1: true }: what's been ticked off while cooking (this device only)
const servingsNow = {};  // recipe id → servings being cooked for
let logOpen = false;     // is the "we made this" date box showing?

function showRecipe(id) {
  const r = recipes[id];
  const box = $('#recipeView');
  if (!r) {
    box.innerHTML = loaded ? `<div class="empty"><span class="big">🤷</span>That recipe isn’t here (maybe it was deleted). <a href="#">Back to the bookshelf</a></div>`
      : '<div class="empty">Opening the book…</div>';
    return;
  }
  const me = Family.me();
  const tk = ticks[id] = ticks[id] || {};
  const base = Cook.servingsNumber(r.servings);
  const serves = servingsNow[id] || base;
  const factor = base ? serves / base : 1;
  const img = safeUrl(r.image), src = safeUrl(r.source);
  const favs = Object.keys(r.favs || {}).filter(n => r.favs[n]);
  const cooked = r.cooked || [];

  // Category chips: tap one to open that book on the shelf.
  const chips = CAT_KEYS.map(cat => {
    const c = Cook.find(cat, valueOf(r, cat));
    return c ? `<a class="fact c-${cat}" href="#b=${encodeURIComponent(cat + ':' + c.id)}" title="${esc(CATS[cat].label)}: open that book">${c.emoji} ${esc(c.label)}</a>` : '';
  }).join('') + (r.tags || []).map(t => `<a class="fact c-tag" href="#b=${encodeURIComponent('tag:' + t)}">🏷️ ${esc(t)}</a>`).join('');

  const times = [r.prepMin && `Prep ${fmtMin(r.prepMin)}`, r.cookMin && `Cook ${fmtMin(r.cookMin)}`, timeOf(r) && `Total ${fmtMin(timeOf(r))}`].filter(Boolean).join(' · ');

  const ingredients = (r.ingredients || []).map((line, i) => Cook.isHeading(line)
    ? `<div class="sub">${esc(line.replace(/:$/, ''))}</div>`
    : `<div class="ing${tk['i' + i] ? ' done' : ''}" data-tick="i${i}"><div class="check${tk['i' + i] ? ' done' : ''}"></div><span class="t">${esc(Cook.scale(line, factor))}</span></div>`).join('');
  const steps = (r.steps || []).map((line, i) => Cook.isHeading(line)
    ? `<li class="sub">${esc(line.replace(/:$/, ''))}</li>`
    : `<li class="step${tk['s' + i] ? ' done' : ''}" data-tick="s${i}">${esc(line)}</li>`).join('');

  box.innerHTML = `
    <div class="rv-top">
      <a class="btn ghost sm" href="#" id="rvBack">← Bookshelf</a>
      <span style="flex:1"></span>
      <button class="btn ghost sm" id="rvEdit">✏️ Edit</button>
    </div>
    <div class="card rv-head">
      ${img ? `<img class="hero" src="${esc(img)}" alt="" referrerpolicy="no-referrer" onerror="this.remove()">` : ''}
      <div class="rv-in">
        <h1>${esc(r.title)}</h1>
        ${r.description ? `<p class="rv-desc">${esc(r.description)}</p>` : ''}
        <div class="facts">${chips}</div>
        ${times ? `<div class="times">⏱️ ${esc(times)}</div>` : ''}
        <div class="who-line">
          ${src ? `From <a href="${esc(src)}" target="_blank" rel="noopener noreferrer">${esc(domain(src))} ↗</a> · ` : ''}
          added by ${esc(r.by || '?')}${r.ts ? ', ' + esc(fmtDay(dayKey(new Date(r.ts)))) : ''}
        </div>
        <div class="acts">
          <button class="chipbtn pink${favs.includes(me) ? ' on' : ''}" id="rvFav">❤️ ${favs.length ? esc(favs.join(' & ')) : 'Favourite'}</button>
          <button class="chipbtn${logOpen ? ' on' : ''}" id="rvCooked">✅ We made this</button>
          ${'wakeLock' in navigator ? `<button class="chipbtn${wake ? ' on' : ''}" id="rvWake">📱 ${wake ? 'Screen stays on' : 'Keep screen on'}</button>` : ''}
        </div>
        ${logOpen ? `<div class="logrow">Made it on
          <input type="date" id="logDate" value="${todayKey()}" max="${todayKey()}">
          <button class="btn sm" id="logSave">Save</button>
          <button class="linkbtn" id="logCancel">Cancel</button></div>` : ''}
      </div>
    </div>
    <div class="rv-grid">
      <div class="card">
        <h3>🧺 Ingredients</h3>
        ${base ? `<div class="serv"><button id="servLess" aria-label="Fewer servings">−</button>
          <span>Serves ${serves}${factor !== 1 ? ` <span class="mini">×${Math.round(factor * 100) / 100}</span>` : ''}</span>
          <button id="servMore" aria-label="More servings">+</button></div>`
          : r.servings ? `<div class="serv">Makes ${esc(r.servings)}</div>` : ''}
        ${ingredients || '<div class="empty">No ingredients written down.</div>'}
      </div>
      <div class="card">
        <h3>👩‍🍳 Steps</h3>
        ${steps ? `<ol class="steps">${steps}</ol>` : `<div class="empty">No steps written down.${src ? ` <a href="${esc(src)}" target="_blank" rel="noopener noreferrer">See the original ↗</a>` : ''}</div>`}
      </div>
    </div>
    ${r.notes ? `<div class="card"><h3>📝 Our notes</h3><div class="notes">${esc(r.notes)}</div></div>` : ''}
    <div class="card"><h3>📊 When we make it</h3>${cookStats(r)}</div>`;

  // "← Bookshelf" goes back to the book you came from, if you came from one.
  if (/^#b=/.test(cameFrom)) box.querySelector('#rvBack').href = cameFrom;
  box.querySelector('#rvEdit').onclick = () => openEditor(r, id);
  box.querySelectorAll('[data-tick]').forEach(el => el.onclick = () => { tk[el.dataset.tick] = !tk[el.dataset.tick]; showRecipe(id); });
  box.querySelector('#rvFav').onclick = () => store.update('recipes', id, { favs: Object.assign({}, r.favs, { [me]: !(r.favs || {})[me] }) });
  box.querySelector('#rvCooked').onclick = () => { logOpen = !logOpen; showRecipe(id); };
  if (logOpen) {
    box.querySelector('#logCancel').onclick = () => { logOpen = false; showRecipe(id); };
    box.querySelector('#logSave').onclick = () => {
      const day = box.querySelector('#logDate').value;
      if (!/^\d{4}-\d\d-\d\d$/.test(day)) return;
      if (cooked.some(c => cookedDay(c) === day) && !confirm(`Already marked as made on ${fmtDay(day)}. Count it again?`)) return;
      logOpen = false;
      store.update('recipes', id, { cooked: [...cooked, { by: me, date: day, ts: keyDate(day).getTime() }] });
    };
  }
  box.querySelectorAll('[data-uncook]').forEach(b => b.onclick = () => {
    const i = +b.dataset.uncook;
    if (!confirm(`Remove ${fmtDay(cookedDay(cooked[i]))} from the times we made it?`)) return;
    store.update('recipes', id, { cooked: cooked.filter((_, k) => k !== i) });
  });
  if (base) {
    box.querySelector('#servLess').onclick = () => { servingsNow[id] = Math.max(1, serves - 1); showRecipe(id); };
    box.querySelector('#servMore').onclick = () => { servingsNow[id] = serves + 1; showRecipe(id); };
  }
  const w = box.querySelector('#rvWake');
  if (w) w.onclick = async () => { await setWake(!wake); showRecipe(id); };
}

/* Keep the phone screen on while cooking (asked again when coming back to the page). */
async function setWake(on) {
  try {
    if (on && !wake) { wake = await navigator.wakeLock.request('screen'); wake.addEventListener('release', () => { if (document.visibilityState === 'visible') wake = null; }); }
    if (!on && wake) { const w = wake; wake = null; await w.release(); }
  } catch (e) { wake = null; }
}
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && wake && wake.released) { wake = null; setWake(true); } });

/* ───────── the cooking calendar ───────── */
function allCooked() {
  const out = [];
  for (const [id, r] of Object.entries(recipes)) {
    for (const c of r.cooked || []) out.push({ id, r, day: cookedDay(c), by: c.by || '?' });
  }
  return out.sort((a, b) => a.day.localeCompare(b.day));
}
function showCalendar(month) {
  const box = $('#calView');
  const now = new Date();
  let [y, m] = (month || '').split('-').map(Number);
  if (!y || !m) { y = now.getFullYear(); m = now.getMonth() + 1; }
  const prefix = `${y}-${pad(m)}`;
  const prev = m === 1 ? `${y - 1}-12` : `${y}-${pad(m - 1)}`;
  const next = m === 12 ? `${y + 1}-01` : `${y}-${pad(m + 1)}`;
  const entries = allCooked().filter(e => e.day.startsWith(prefix));
  const byDay = {};
  entries.forEach(e => (byDay[e.day] = byDay[e.day] || []).push(e));
  const emojiOf = r => {
    const p = Cook.find('protein', r.protein);
    return (r.protein && !['none', 'veg'].includes(r.protein) ? p?.emoji : Cook.find('meal', r.meal)?.emoji) || '🍽️';
  };

  // The month grid, Monday first.
  const first = new Date(y, m - 1, 1);
  const blanks = (first.getDay() + 6) % 7;
  const daysIn = new Date(y, m, 0).getDate();
  const cells = [];
  for (let i = 0; i < blanks; i++) cells.push('<div class="day blank"></div>');
  for (let d = 1; d <= daysIn; d++) {
    const key = `${prefix}-${pad(d)}`;
    const list = byDay[key] || [];
    cells.push(`<div class="day${list.length ? ' has' : ''}${key === todayKey() ? ' today' : ''}"><span class="d">${d}</span>
      ${list.slice(0, 3).map(e => `<a class="ce" href="#r=${encodeURIComponent(e.id)}" title="${esc(e.r.title)} (${esc(e.by)})">${emojiOf(e.r)} <span class="t">${esc(e.r.title)}</span></a>`).join('')}
      ${list.length > 3 ? `<span class="more">+${list.length - 3} more</span>` : ''}</div>`);
  }

  // A few numbers for the month.
  const counts = {};
  entries.forEach(e => { counts[e.id] = (counts[e.id] || 0) + 1; });
  const top = Object.entries(counts).sort((a, b) => b[1] - a[1])[0];
  const who = {};
  entries.forEach(e => { who[e.by] = (who[e.by] || 0) + 1; });
  const total = allCooked().length;

  box.innerHTML = `
    <div class="card">
      <div class="calhead">
        <a class="btn ghost sm" href="#cal=${prev}" aria-label="Previous month">‹</a>
        <h2>${MONTH_NAMES[m - 1]} ${y}</h2>
        <a class="btn ghost sm" href="#cal=${next}" aria-label="Next month">›</a>
      </div>
      <div class="calgrid">
        ${['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'].map(d => `<div class="wd">${d}</div>`).join('')}
        ${cells.join('')}
      </div>
    </div>
    <div class="card">
      <h3>📊 ${MONTH_NAMES[m - 1]} in the kitchen</h3>
      ${entries.length ? `
        <div class="stats">
          <div class="stat"><b>${entries.length}</b><span>meals logged</span></div>
          <div class="stat"><b>${Object.keys(counts).length}</b><span>different recipes</span></div>
          ${top && top[1] > 1 ? `<div class="stat"><b>${top[1]}×</b><span>${esc(recipes[top[0]]?.title || '')}</span></div>` : ''}
        </div>
        <p class="statline">👩‍🍳 ${Object.entries(who).sort((a, b) => b[1] - a[1]).map(([p, c]) => `<b>${esc(p)}</b> ${c}×`).join(', ')}</p>
        ${entries.slice().reverse().map(e => `<div class="calrow"><span class="dt">${WEEKDAYS[keyDate(e.day).getDay()].slice(0, 3)} ${keyDate(e.day).getDate()} ${MONTHS[m - 1]}</span>
          <a href="#r=${encodeURIComponent(e.id)}">${emojiOf(e.r)} ${esc(e.r.title)}</a><span class="who-pill">${esc(e.by)}</span></div>`).join('')}`
        : `<div class="empty"><span class="big">🗓️</span>Nothing logged in ${MONTH_NAMES[m - 1]}.${total ? '' : ' Open a recipe and tap <b>✅ We made this</b> to start filling the calendar.'}</div>`}
    </div>`;
}

/* ───────── which page is showing ───────── */
let cameFrom = '';       // the page before this one (so a recipe can go back to its book)
let lastHash = location.hash;
function route() {
  const h = location.hash;
  const r = h.match(/^#r=(.+)$/), b = h.match(/^#b=(.+)$/), cal = h.match(/^#cal(?:=(\d{4}-\d\d))?$/);
  $('#shelfView').hidden = !!(r || b || cal);
  $('#bookView').hidden = !b;
  $('#recipeView').hidden = !r;
  $('#calView').hidden = !cal;
  $('#tabShelf').classList.toggle('on', !cal);
  $('#tabCal').classList.toggle('on', !!cal);
  if (!r && wake) setWake(false);
  if (r) showRecipe(decodeURIComponent(r[1]));
  else if (b) showBook(decodeURIComponent(b[1]));
  else if (cal) showCalendar(cal[1]);
  else showShelf();
}
window.addEventListener('hashchange', () => {
  if (location.hash !== lastHash) { cameFrom = lastHash; logOpen = false; window.scrollTo(0, 0); }
  lastHash = location.hash;
  route();
});

/* ───────── adding a recipe ───────── */
function say(text, bad) { const m = $('#addMsg'); m.textContent = text; m.className = 'msg' + (bad ? ' bad' : ''); }
// The paste is just a link? (one "word" that looks like a web address)
function onlyLink(text) {
  const t = text.trim();
  if (/\s/.test(t)) return '';
  if (/^https?:\/\/\S+\.\S+/i.test(t)) return t;
  if (/^www\.\S+\.\S+/i.test(t)) return 'https://' + t;
  return '';
}

let adding = false;
async function addFromPaste() {
  if (adding) return;
  const raw = $('#paste').value;
  if (!raw.trim()) { say('Paste a link or a recipe in the box first.', true); return; }
  const link = onlyLink(raw);
  let draft, note = '', bad = false;

  if (link) {
    const already = Object.entries(recipes).find(([, r]) => r.source && sameLink(r.source) === sameLink(link));
    if (already) { say('That one’s already in the cookbook!'); location.hash = 'r=' + encodeURIComponent(already[0]); return; }
    say('📡 Reading the recipe page… (can take up to half a minute for fussy sites)');
    adding = true; $('#addBtn').disabled = true;
    try {
      const out = await Family.call('recipes', 'import', { url: link });
      if (out.found === 'schema') {
        draft = Cook.fromSchema(out.recipe);
      } else {
        // No tidy copy on the page: read its text the same way as a pasted recipe.
        draft = Cook.parseText(out.text || '');
        const meta = out.recipe || {};
        if (meta.title) draft.title = meta.title.replace(/\s*[|–—-]\s*[^|–—-]{2,40}$/, '');   // drop " | Site name"
        draft.image = meta.image || '';
        draft.description = meta.description || draft.description;
      }
      draft.source = out.source || link;
      if (!draft.ingredients.length && !draft.steps.length) {
        note = 'We couldn’t find the recipe on that page (some sites hide it). Copy the recipe text from the page and paste it into the boxes below.';
        bad = true;
      }
    } catch (e) {
      say(e.message === 'not_family' ? 'Please sign in again.' : '😕 ' + e.message, true);
      return;
    } finally {
      adding = false; $('#addBtn').disabled = false;
    }
  } else {
    draft = Cook.parseText(raw);
    if (!draft.ingredients.length && !draft.steps.length) {
      note = 'We couldn’t tell which lines are ingredients and which are steps. Sort them into the boxes below.';
      bad = true;
      draft.steps = raw.split('\n').map(s => s.trim()).filter(Boolean).slice(1);
    }
  }
  say('');
  Object.assign(draft, Cook.guess(draft));
  if (!note) note = `✨ Sorted for you${draft.timeGuessed ? ' (the time is a rough guess)' : ''}. Check it looks right, then save.`;
  openEditor(draft, null, note, bad);
}
$('#addBtn').onclick = addFromPaste;
$('#paste').addEventListener('keydown', e => { if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) addFromPaste(); });
// A pasted link goes straight in, no button needed.
$('#paste').addEventListener('paste', () => setTimeout(() => { if (onlyLink($('#paste').value)) addFromPaste(); }, 0));
$('#blankBtn').onclick = () => openEditor({ title: '', ingredients: [], steps: [], meal: 'dinner', tags: [] }, null, '');

/* ───────── the edit box ───────── */
const ed = $('#ed'), form = $('#edForm');
let editing = null;      // id of the recipe being edited (null = a new one)
let edTags = [];         // labels ticked in the edit box

function catSelects(r) {
  $('#edCats').innerHTML = ['meal', 'protein', 'cuisine', 'difficulty', 'cost'].map(cat => `
    <label>${esc(CATS[cat].label)}<select class="field" name="${cat}">
      <option value="">—</option>
      ${CATS[cat].items.map(([id, emoji, label]) => `<option value="${id}"${r[cat] === id ? ' selected' : ''}>${emoji} ${esc(label)}</option>`).join('')}
    </select></label>`).join('');
}
function tagBoxes() {
  const names = [...new Set([...allTags(), ...edTags])];
  $('#edTags').innerHTML = names.map(t => `<label><input type="checkbox" value="${esc(t)}"${edTags.includes(t) ? ' checked' : ''}> ${esc(t)}</label>`).join('');
  $('#edTags').querySelectorAll('input').forEach(c => c.onchange = () => {
    edTags = c.checked ? [...edTags, c.value] : edTags.filter(t => t !== c.value);
  });
}
$('#edAddTag').onclick = () => {
  const t = $('#edNewTag').value.trim().replace(/\s+/g, ' ');
  if (!t) return;
  if (!edTags.includes(t)) edTags.push(t);
  $('#edNewTag').value = '';
  tagBoxes();
};
$('#edNewTag').addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); $('#edAddTag').click(); } });

function openEditor(r, id, note, bad) {
  editing = id;
  form.reset();
  $('#edHead').textContent = id ? '✏️ Edit recipe' : '📝 New recipe';
  $('#edNote').hidden = !note;
  $('#edNote').textContent = note || '';
  $('#edNote').className = 'guessnote' + (bad ? ' bad' : '');
  $('#edDel').hidden = !id;
  for (const k of ['title', 'source', 'image', 'servings', 'description', 'notes']) form[k].value = r[k] || '';
  for (const k of ['prepMin', 'cookMin', 'totalMin']) form[k].value = r[k] || '';
  form.ingredients.value = (r.ingredients || []).join('\n');
  form.steps.value = (r.steps || []).join('\n');
  catSelects(r);
  edTags = [...(r.tags || [])];
  tagBoxes();
  ed.showModal();
  ed.scrollTop = 0;
  if (!r.title) form.title.focus();
}

const lines = text => String(text || '').split('\n').map(s => s.trim()).filter(Boolean);
const minutesField = v => { const n = Math.round(+v); return n > 0 ? n : null; };
function readForm() {
  const prepMin = minutesField(form.prepMin.value), cookMin = minutesField(form.cookMin.value);
  return {
    title: form.title.value.trim(),
    source: safeUrl(form.source.value),
    image: safeUrl(form.image.value),
    servings: form.servings.value.trim(),
    prepMin, cookMin,
    totalMin: minutesField(form.totalMin.value) || ((prepMin || 0) + (cookMin || 0)) || null,
    ingredients: lines(form.ingredients.value),
    steps: lines(form.steps.value),
    description: form.description.value.trim(),
    notes: form.notes.value.trim(),
    meal: form.meal.value, protein: form.protein.value, cuisine: form.cuisine.value,
    difficulty: form.difficulty.value, cost: form.cost.value,
    tags: edTags,
  };
}

// "Guess again": sort it afresh from what's in the boxes now (your own labels are kept).
$('#edGuess').onclick = () => {
  const r = readForm();
  const g = Cook.guess(r);
  catSelects(g);
  if (!form.totalMin.value) form.totalMin.value = g.totalMin || '';
  const own = edTags.filter(t => !Cook.TAGS.includes(t));
  edTags = [...new Set([...g.tags, ...own])];
  tagBoxes();
  $('#edNote').hidden = false;
  $('#edNote').className = 'guessnote';
  $('#edNote').textContent = '✨ Sorted again from the ingredients and steps.';
};

form.addEventListener('submit', async e => {
  e.preventDefault();
  const r = readForm();
  if (!r.title) { form.title.focus(); return; }
  const id = editing;
  ed.close();
  if (id) {
    await store.update('recipes', id, r);
    location.hash = 'r=' + encodeURIComponent(id);
  } else {
    const newId = await store.add('recipes', Object.assign(r, { favs: {}, cooked: [] }));
    $('#paste').value = '';
    location.hash = 'r=' + encodeURIComponent(newId);
  }
});
$('#edCancel').onclick = () => ed.close();
// Catch up on anything that changed while the box was open.
ed.addEventListener('close', () => route());
$('#edDel').onclick = async () => {
  if (!editing || !confirm(`Delete “${recipes[editing]?.title || 'this recipe'}” from the cookbook?`)) return;
  const id = editing;
  ed.close();
  location.hash = '';
  await store.remove('recipes', id);
};

/* ───────── start ───────── */
store.ready.then(() => {
  const cloud = store.mode === 'cloud';
  $('#sync').className = 'badge ' + (cloud ? 'ok' : 'local');
  $('#sync').textContent = cloud ? '☁️ Synced' : '📴 This device only';
});
store.watch('recipes', items => {
  recipes = items;
  loaded = true;
  // Don't redraw a page under someone's fingers while they edit a recipe.
  if (!ed.open) route();
});
route();
</script>
</body>
</html>
