<!DOCTYPE html>
<html lang="nb">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Norskprøven</title>

<!-- ════════════════════════════════════════════════════════════════
     NORSKPRØVEN B1–B2: study tool for the Norwegian language test (HK-dir).

       data.js      grammar notes + questions, word cards, phrase bank
       oppgaver.js  reading texts, listening clips, writing and speaking tasks
       this file    the app, in seven tabs:
                    Plan · Grammatikk · Lese · Lytte · Skrive · Snakke · Ord

     Built from the same pattern as tools/teoriprove/.
     Progress (answers, finished sessions) is saved per person with
     Family.store('norskprove') in collection "progress".
     Written texts are shared in collection "texts", so the family can read
     them and leave feedback.
     Listening uses the browser's own Norwegian voice (speech synthesis):
     nothing is downloaded and no audio files are needed.
     Recordings in the Snakke tab stay in the browser and are never uploaded.
═════════════════════════════════════════════════════════════════ -->

<link rel="stylesheet" href="../../shared/family.css">
<style>
/* Layout: one study column under a sticky header with seven tabs.
   Colours come from shared/family.css (--meadow, --forest, --cream, --paper, --ink, --line…). */
:root{
  --bgc:var(--cream); --surf:var(--paper); --sunk:#eef0e8;
  --accent:var(--meadow-deep); --accent-ink:#fff; --accent-soft:#e3f1df;
  --flag:#ba0c2f;
  --ok:#3f8a52; --ok-soft:#e3f1df; --bad:#c2453a; --bad-soft:#fdeceb; --warn:#b07d12; --warn-soft:#fcf3d2;
  --rr:14px;
}
*{box-sizing:border-box}
body{font-size:16px;line-height:1.55}
h1,h2,h3{font-family:"Fredoka",system-ui,sans-serif;font-weight:600;color:var(--forest);line-height:1.2;text-wrap:balance;margin:0}
button{font:inherit;color:inherit}
a{color:var(--accent)}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:6px}

/* Language: every text pair is <span class="nb">…</span><span class="en">…</span>.
   The class on <html> decides which one shows: l-nb (Norwegian), l-both, l-en (English). */
.en{display:none}
.l-both .en{display:block;color:var(--ink-soft);font-size:.88em;font-style:italic;font-weight:400;margin-top:2px}
.l-en .nb{display:none}
.l-en .en{display:block}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:var(--bgc);border-bottom:1px solid var(--line)}
.top-in{max-width:880px;margin:0 auto;padding:12px 16px 0;display:flex;flex-direction:column;gap:10px}
.brand{display:flex;align-items:center;gap:10px;justify-content:space-between;flex-wrap:wrap}
.brand-l{display:flex;align-items:center;gap:12px;min-width:0}
.brand-l .mark{font-size:1.7rem;line-height:1}
.brand h1{font-size:1.2rem;letter-spacing:-.01em}
.brand small{display:block;font-weight:400;font-size:.78rem;color:var(--ink-soft);letter-spacing:.02em}
.brand-r{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;background:var(--surf);padding:3px}
.seg button{border:0;background:none;border-radius:999px;padding:4px 10px;font-size:.82rem;font-weight:700;color:var(--ink-soft);cursor:pointer;white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.seg .s{display:none}
@media (max-width:560px){.seg .f{display:none}.seg .s{display:inline}}
.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{background:none;border:0;padding:8px 12px 10px;cursor:pointer;color:var(--ink-soft);font-weight:700;border-bottom:3px solid transparent;white-space:nowrap;font-size:.95rem}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--flag)}
.tab:hover{color:var(--ink)}

main.sb{max-width:880px;margin:0 auto;padding-inline:16px;padding-block:24px 64px;display:flex;flex-direction:column;gap:24px}

/* generic */
.eyebrow{font-size:.74rem;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-soft)}
.scard{background:var(--surf);border:1px solid var(--line);border-radius:var(--rr);padding:20px}
.muted{color:var(--ink-soft)}
.small{font-size:.85rem}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.between{justify-content:space-between}
.sbtn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surf);padding:10px 16px;border-radius:8px;cursor:pointer;font-weight:700;font-size:.95rem;text-decoration:none;color:var(--ink)}
.sbtn:hover{border-color:var(--accent)}
.sbtn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.sbtn.primary:hover{filter:brightness(1.08)}
.sbtn.ghost{background:none}
.sbtn.small{padding:6px 11px;font-size:.85rem}
.sbtn.danger{color:var(--bad)}
.sbtn[disabled]{opacity:.45;cursor:not-allowed}
.mono{font-variant-numeric:tabular-nums;font-weight:800}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--surf);border-radius:999px;padding:6px 12px;font-size:.85rem;cursor:pointer;color:var(--ink);text-align:left}
.chip[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);font-weight:700}
.chip .n{color:var(--ink-soft);font-size:.78rem;margin-left:4px}
.modlabel{font-size:.74rem;color:var(--ink-soft);font-weight:700;letter-spacing:.06em;text-transform:uppercase;margin:10px 0 6px}
.bar{height:6px;border-radius:3px;background:var(--sunk);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--ok);border-radius:3px}
.lvl{display:inline-block;font-size:.72rem;font-weight:800;padding:2px 8px;border-radius:999px;background:var(--sunk);color:var(--ink-soft);letter-spacing:.04em}
.lvl.B2{background:#fbe3e7;color:var(--flag)}
.lvl.B1{background:#e3eef7;color:#2c5d88}
ul.clean{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px}

/* plan */
.hero h2{font-size:clamp(1.7rem,4.6vw,2.4rem);letter-spacing:-.02em}
.hero p{margin:.5em 0 0;max-width:62ch}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));border:1px solid var(--line);border-radius:var(--rr);background:var(--surf);overflow:hidden}
.fact{padding:14px 16px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);margin:0 -1px -1px 0}
.fact .k{font-size:.74rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--flag)}
.fact b{display:block;font-family:"Fredoka",sans-serif;font-size:1.5rem;line-height:1.15}
.fact span{font-size:.85rem;color:var(--ink-soft)}
.days{display:flex;flex-direction:column;gap:10px}
.day{display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:start;background:var(--surf);border:1px solid var(--line);border-radius:var(--rr);padding:14px 16px}
.day.done{opacity:.62}
.day .dnum{font-family:"Fredoka",sans-serif;font-size:1.5rem;line-height:1;width:2.2ch;color:var(--flag)}
.day h3{font-size:1.05rem;font-family:inherit}
.day .chs{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.scheck{width:26px;height:26px;border-radius:6px;border:2px solid var(--line);background:var(--surf);cursor:pointer;display:grid;place-items:center;color:var(--accent-ink);padding:0}
.scheck[aria-pressed="true"]{background:var(--ok);border-color:var(--ok)}
.prow{display:grid;grid-template-columns:minmax(0,1fr) 110px 70px;gap:12px;align-items:center;padding:9px 4px;border:0;border-bottom:1px solid var(--line);cursor:pointer;background:none;text-align:left;width:100%}
.prow:hover{background:var(--sunk)}
.prow .lbl{min-width:0}
.prow .pct{text-align:right;font-size:.82rem;color:var(--ink-soft)}

/* notes */
.notes h2{font-size:1.6rem}
.notes ul{list-style:none;padding:0;margin:0}
.notes li{padding:11px 0 11px 18px;border-bottom:1px solid var(--line);position:relative;max-width:70ch}
.notes li::before{content:"";position:absolute;left:2px;top:20px;width:6px;height:6px;border-radius:50%;background:var(--flag)}
.notes li.h{padding:22px 0 6px;border-bottom:0;font-family:"Fredoka",sans-serif;font-size:1.12rem;font-weight:600;color:var(--forest)}
.notes li.h::before{display:none}

/* question */
.qcard{background:var(--surf);border:1px solid var(--line);border-radius:14px;padding:22px;display:flex;flex-direction:column;gap:16px}
.qmeta{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;font-size:.84rem;color:var(--ink-soft)}
.qtext{font-size:1.25rem;font-weight:700;line-height:1.35}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{display:grid;grid-template-columns:34px 1fr;gap:12px;align-items:center;text-align:left;width:100%;background:var(--bgc);border:2px solid var(--line);border-radius:10px;padding:12px 14px;cursor:pointer;transition:border-color .12s,background .12s}
.opt:hover:not([disabled]){border-color:var(--accent)}
.opt .L{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-weight:700;background:var(--surf);border:1px solid var(--line);font-size:.9rem}
.opt .t{min-width:0}
.opt[disabled]{cursor:default}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.right .L{background:var(--ok);color:var(--accent-ink);border-color:var(--ok)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt.wrong .L{background:var(--bad);color:var(--accent-ink);border-color:var(--bad)}
.verdict{border-radius:10px;padding:12px 14px;font-size:.95rem}
.verdict.ok{background:var(--ok-soft);border-left:4px solid var(--ok)}
.verdict.no{background:var(--bad-soft);border-left:4px solid var(--bad)}
.verdict.info{background:var(--sunk);border-left:4px solid var(--ink-soft)}
.verdict .vh{font-weight:800;margin-bottom:2px}
.kbd{font-size:.75rem;border:1px solid var(--line);border-radius:4px;padding:1px 5px;color:var(--ink-soft)}
.score{display:flex;gap:16px;flex-wrap:wrap;font-size:.9rem}
.result{display:flex;flex-direction:column;gap:6px;align-items:flex-start}
.result .big{font-family:"Fredoka",sans-serif;font-size:clamp(2.6rem,9vw,4rem);line-height:1}

/* task lists (reading, listening, writing) */
.tlist{display:flex;flex-direction:column;gap:8px}
.titem{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:center;text-align:left;width:100%;background:var(--surf);border:1px solid var(--line);border-radius:12px;padding:12px 14px;cursor:pointer}
.titem:hover{border-color:var(--accent)}
.titem b{display:block}
.titem .sub{font-size:.82rem;color:var(--ink-soft)}
.titem .st{font-size:.82rem;font-weight:800;color:var(--ink-soft);white-space:nowrap}
.titem .st.done{color:var(--ok)}

/* reading */
.rtext{background:var(--surf);border:1px solid var(--line);border-radius:var(--rr);padding:22px 24px;font-size:1.05rem;line-height:1.7}
.rtext p{margin:0 0 .9em;max-width:68ch}
.rtext p:last-child{margin-bottom:0}
.rtext .gap{display:block;border:2px dashed var(--flag);border-radius:10px;padding:10px;text-align:center;color:var(--flag);font-weight:800}
.rq{display:flex;flex-direction:column;gap:10px;background:var(--surf);border:1px solid var(--line);border-radius:14px;padding:18px}
.rqq{font-weight:700;font-size:1.05rem;display:flex;gap:10px;align-items:baseline}
.rqq .num{flex:none;width:26px;height:26px;border-radius:50%;background:var(--sunk);display:grid;place-items:center;font-size:.8rem}
.gloss{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:4px 16px;font-size:.92rem}
.gloss b{color:var(--forest)}

/* listening */
.player{display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;padding:26px 20px}
.play{width:92px;height:92px;border-radius:50%;border:0;background:var(--accent);color:#fff;font-size:2.2rem;cursor:pointer;display:grid;place-items:center;box-shadow:0 8px 24px rgba(63,94,68,.25)}
.play[disabled]{background:var(--sunk);color:var(--ink-soft);box-shadow:none;cursor:not-allowed}
.play.on{background:var(--flag)}
@media (prefers-reduced-motion:no-preference){.play.on{animation:pulse 1.4s ease-in-out infinite}}
@keyframes pulse{50%{transform:scale(1.06)}}
.transcript p{margin:0 0 8px}
.transcript .who{font-weight:800;color:var(--forest);margin-right:6px}
select.sel{border:1px solid var(--line);background:var(--surf);border-radius:8px;padding:6px 8px;font:inherit;font-size:.88rem;max-width:100%}

/* writing */
.prompt{border-left:4px solid var(--flag);background:var(--surf);border-radius:0 var(--rr) var(--rr) 0;padding:16px 18px;border-top:1px solid var(--line);border-right:1px solid var(--line);border-bottom:1px solid var(--line)}
.prompt .pt{font-size:1.08rem;font-weight:700;margin:4px 0 8px}
textarea.ed{width:100%;min-height:340px;border:2px solid var(--line);border-radius:12px;padding:14px 16px;font:inherit;font-size:1.02rem;line-height:1.6;background:#fff;resize:vertical}
textarea.ed:focus{border-color:var(--accent);outline:none}
textarea.fbin{width:100%;min-height:90px;border:2px solid var(--line);border-radius:10px;padding:10px 12px;font:inherit;background:#fff}
.wc{display:flex;align-items:center;gap:10px;font-size:.88rem;color:var(--ink-soft)}
.wc .bar{flex:1}
.wc b{color:var(--ink)}
details.phr{background:var(--surf);border:1px solid var(--line);border-radius:12px;padding:10px 14px}
details.phr summary{cursor:pointer;font-weight:800}
.phgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px;margin-top:10px}
.phgrid h4{margin:0 0 4px;font-size:.8rem;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-soft)}
.phgrid ul{margin:0;padding-left:18px;font-size:.92rem}
.phgrid .en{font-size:.82em}
.checks{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:8px}
.checks li{padding:10px 12px;border-radius:10px;background:var(--sunk);font-size:.93rem}
.checks li.w{background:var(--warn-soft);border-left:4px solid var(--warn)}
.checks li.g{background:var(--ok-soft);border-left:4px solid var(--ok)}
.checks q{font-style:italic;quotes:"«" "»"}
.wtext{white-space:pre-wrap;background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px 18px;line-height:1.65}
.fb{border-left:3px solid var(--accent);padding:6px 12px;margin:8px 0;background:var(--surf)}
.fb .who{font-size:.8rem;font-weight:800;color:var(--ink-soft)}
.fb div{white-space:pre-wrap}

/* timers */
.timer{font-size:1.4rem;font-variant-numeric:tabular-nums;font-weight:800;padding:4px 12px;border-radius:8px;background:var(--surf);border:1px solid var(--line)}
.timer.low{color:var(--bad);border-color:var(--bad)}
.bigtime{font-family:"Fredoka",sans-serif;font-size:clamp(3rem,12vw,4.6rem);font-variant-numeric:tabular-nums;line-height:1;color:var(--forest)}
.bigtime.over{color:var(--bad)}
.confirm{border:2px solid var(--warn);background:var(--warn-soft);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:10px}

/* speaking */
.stype{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
.stype button{text-align:left;border:2px solid var(--line);background:var(--surf);border-radius:12px;padding:14px;cursor:pointer}
.stype button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.stype b{display:block}
.stype span{font-size:.85rem;color:var(--ink-soft)}
.claim{font-family:"Fredoka",sans-serif;font-size:clamp(1.3rem,4vw,1.7rem);color:var(--forest);line-height:1.3}
.phase{display:flex;gap:6px;flex-wrap:wrap;font-size:.8rem}
.phase span{padding:4px 10px;border-radius:999px;background:var(--sunk);color:var(--ink-soft);font-weight:700}
.phase span.on{background:var(--flag);color:#fff}
.phase span.ok{background:var(--ok-soft);color:var(--ok)}

/* flashcards */
.fcard{min-height:230px;border-radius:14px;border:1px solid var(--line);background:var(--surf);padding:26px;display:flex;flex-direction:column;justify-content:center;gap:12px;cursor:pointer;width:100%;text-align:left}
.fcard>span{display:block}
.fcard .side{font-size:.74rem;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-soft);font-weight:700}
.fcard .front{font-family:"Fredoka",sans-serif;font-size:1.7rem;color:var(--forest)}
.fcard .ans{font-family:"Fredoka",sans-serif;font-size:1.45rem;color:var(--ok)}
.fcard .ex{font-style:italic;color:var(--ink-soft)}
.fcard.flipped{border-color:var(--ok)}
@media (prefers-reduced-motion:no-preference){.qcard,.fcard{animation:rise .22s ease-out}}
@keyframes rise{from{transform:translateY(4px);opacity:.6}to{transform:none;opacity:1}}
.foot{font-size:.8rem;color:var(--ink-soft);border-top:1px solid var(--line);padding-top:16px}
@media (max-width:560px){
  .prow{grid-template-columns:minmax(0,1fr) 60px 52px}
  .qcard{padding:16px}
  .qtext{font-size:1.12rem}
  .rtext{padding:16px;font-size:1rem}
  .brand small{display:none}
  .tab{padding:8px 9px 10px;font-size:.9rem}
}
.sbadge{font-size:.75rem;font-weight:800;padding:4px 10px;border-radius:999px;background:var(--sunk);color:var(--ink-soft);white-space:nowrap}
.sbadge.ok{background:var(--accent-soft);color:var(--forest)}
</style>
</head>
<body data-tool="norskprove">
<header class="top">
  <div class="top-in">
    <div class="brand">
      <div class="brand-l">
        <span class="mark" aria-hidden="true">🗣️</span>
        <div><h1>Norskprøven B1–B2</h1><small>Lese · lytte · skrive · snakke</small></div>
      </div>
      <div class="brand-r">
        <span class="sbadge" id="sync">…</span>
        <div class="seg" role="group" aria-label="Språk / Language" id="langs"></div>
      </div>
    </div>
    <nav class="tabs" role="tablist" id="tabs"></nav>
  </div>
</header>
<main class="sb" id="view" aria-live="polite"></main>

<script src="../../site.js"></script>
<script src="../../shared/family.js"></script>
<script src="data.js"></script>
<script src="oppgaver.js"></script>
<script>
(function(){
"use strict";
const $=s=>document.querySelector(s);
const esc=Family.esc;
// Every question and card gets a stable id from its text, so saved progress survives edits elsewhere.
function hash(s){let h=5381;for(let i=0;i<s.length;i++)h=((h<<5)+h+s.charCodeAt(i))|0;return (h>>>0).toString(36)}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function range(n){return Array.from({length:n},(_,i)=>i)}
function pick(a){return a[Math.floor(Math.random()*a.length)]}
// bi(): a Norwegian/English text pair; the language setting decides what shows.
function bi(nb,en){return '<span class="nb">'+nb+'</span>'+(en?'<span class="en" lang="en">'+en+'</span>':'')}
// t(): one short UI label, in English only when English is chosen.
function t(nb,en){return S.lang==="en"?en:nb}
const L=["A","B","C","D","E"];

Q.forEach(x=>{x.id="g-"+x.ch+"-"+hash(x.nb+x.o[0])});
const qById={}; Q.forEach(x=>qById[x.id]=x);
const chById={}; CH.forEach(c=>chById[c.id]=c);
const byCh={}; CH.forEach(c=>byCh[c.id]=Q.filter(x=>x.ch===c.id));
const readById={}; READ.forEach(r=>{readById[r.id]=r; r.qs.forEach(q=>q.id="r-"+r.id+"-"+hash(q.q))});
const lisById={}; LISTEN.forEach(c=>{lisById[c.id]=c; c.qs.forEach(q=>q.id="l-"+c.id+"-"+hash(q.q))});
const CARDS=[]; DECKS.forEach(d=>WORDS[d.id].forEach(w=>CARDS.push({id:"v-"+d.id+"-"+hash(w[0]),deck:d.id,nb:w[0],en:w[1],ex:w[2]})));
const cardById={}; CARDS.forEach(c=>cardById[c.id]=c);
const deckById={}; DECKS.forEach(d=>deckById[d.id]=d);
const emailById={}; EMAIL.forEach(e=>emailById[e.id]=e);
const argById={}; ARG.forEach(a=>argById[a.id]=a);
const READ_QS=[].concat(...READ.map(r=>r.qs)), LIS_QS=[].concat(...LISTEN.map(c=>c.qs));

/* ---------- saving ----------
   Settings, drafts and an exam in progress stay in this browser (localStorage).
   Progress (answers, finished sessions, speaking count) is ALSO saved to the family account,
   one record per person in collection "progress". Whichever copy is newest (field "ts") wins.
   Written texts go to collection "texts" (shared, so others can give feedback). */
const TOOL_ID="norskprove";
const store=Family.store(TOOL_ID);
const KEY="norskprove-v1";
let S={lang:"both",tab:"plan",stats:{},days:{},spk:0,ts:0,gr:"ord",gSel:["all"],deck:"kon",dir:"nb",rate:1,voice:"",lsFree:false,drafts:{},wx:null,wt:null,wview:null,sp:{t:"paa",i:0}};
try{const raw=localStorage.getItem(KEY); if(raw) Object.assign(S,JSON.parse(raw));}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
let meId=null, pushTimer=null, TEXTS={};
function saveProgress(){S.ts=Date.now();save();
  if(!meId) return;
  clearTimeout(pushTimer);

/* ════════════ LYTTE ════════════
   The browser reads the clips aloud with a Norwegian voice (speech synthesis). */
let LS=null;   // the open clip: {id, plays, playing, ans:{}, ord:{}, show}
function nbVoices(){try{return speechSynthesis.getVoices().filter(v=>/^(nb|no|nn)([-_]|$)/i.test(v.lang))}catch(e){return []}}
const canSpeak="speechSynthesis" in window;
// voiceFor(): pick a voice + pitch for a speaker. k = woman, m = man, n = announcer.
function voiceFor(sp){
  const vs=nbVoices();
  const pitch=sp==="m"?0.85:sp==="k"?1.12:1;
  if(!vs.length) return {v:null,p:pitch};
  if(S.voice){const v=vs.find(x=>x.voiceURI===S.voice); if(v) return {v:v,p:pitch}}
  const fem=vs.find(v=>/pernille|iselin|hulda|nora|liv|ingrid|female|kvinne/i.test(v.name));
  const mal=vs.find(v=>/finn|jon|henrik|arne|male|mann/i.test(v.name)&&!/female/i.test(v.name));
  if(sp==="m") return mal?{v:mal,p:1}:{v:vs.length>1?vs[1]:vs[0],p:vs.length>1&&!fem?1:0.85};
  return fem?{v:fem,p:1}:{v:vs[0],p:sp==="k"?1.12:1};
}
let speakToken=0;
// speak(): read [speaker, text] lines aloud, one sentence at a time (long utterances can stall in some browsers).
function speak(lines,onend){
  if(!canSpeak){onend&&onend();return}
  speechSynthesis.cancel();
  const my=++speakToken; const parts=[];
  lines.forEach(l=>{const vp=voiceFor(l[0]);(l[1].match(/[^.!?…]+[.!?…»]*["»]?\s*/g)||[l[1]]).forEach(s=>{if(s.trim())parts.push([s.trim(),vp])})});
  if(!parts.length){onend&&onend();return}
  parts.forEach((p,i)=>{
    const u=new SpeechSynthesisUtterance(p[0]); u.lang="nb-NO"; if(p[1].v)u.voice=p[1].v; u.pitch=p[1].p; u.rate=S.rate||1;
    if(i===parts.length-1){u.onend=()=>{if(my===speakToken&&onend)onend()}}
    u.onerror=()=>{if(my===speakToken&&i===parts.length-1&&onend)onend()};
    speechSynthesis.speak(u);
  });
}
function stopSpeak(){speakToken++;try{speechSynthesis.cancel()}catch(e){}}
if(canSpeak) speechSynthesis.onvoiceschanged=()=>{if(S.tab==="lytte"||S.tab==="snakke"||S.tab==="ord")softRender()};
function maxPlays(c){return S.lsFree?99:(c.lvl==="B2"?1:2)}
function openListen(id){const c=lisById[id];stopSpeak();LS={id:id,plays:0,playing:false,ans:{},ord:{},show:false};c.qs.forEach((q,i)=>LS.ord[i]=shuffle(range(q.o.length)))}
function voiceBar(){
  const vs=nbVoices();
  let h='<div class="row small" style="gap:14px">';
  if(vs.length>1) h+='<label>'+t("Stemme","Voice")+' <select class="sel" data-chg="voice"><option value="">'+t("Automatisk","Automatic")+'</option>'+vs.map(v=>'<option value="'+esc(v.voiceURI)+'"'+(S.voice===v.voiceURI?' selected':'')+'>'+esc(v.name)+'</option>').join("")+'</select></label>';
  h+='<label>'+t("Fart","Speed")+' <select class="sel" data-chg="rate">'+[[0.8,"0,8×"],[0.9,"0,9×"],[1,"1×"],[1.1,"1,1×"]].map(r=>'<option value="'+r[0]+'"'+((S.rate||1)==r[0]?' selected':'')+'>'+r[1]+'</option>').join("")+'</select></label>';
  h+='<label><input type="checkbox" data-chg="lsfree"'+(S.lsFree?' checked':'')+'> '+t("Øvemodus: spill av så mange ganger du vil","Practice mode: unlimited plays")+'</label></div>';
  if(!canSpeak) h+='<div class="verdict no" style="margin-top:10px">'+bi("Denne nettleseren kan ikke lese opp tekst. Prøv Chrome, Edge eller Safari.","This browser can't read text aloud. Try Chrome, Edge or Safari.")+'</div>';
  else if(!vs.length) h+='<div class="verdict info" style="margin-top:10px">'+bi("Fant ingen norsk stemme på denne enheten, så uttalen kan bli rar. På Windows: Innstillinger → Tid og språk → Tale → Legg til stemmer → Norsk (bokmål). Microsoft Edge har gode norske stemmer innebygd, og det har også de fleste mobiler.","No Norwegian voice found on this device, so pronunciation may sound odd. On Windows: Settings → Time & language → Speech → Add voices → Norwegian (Bokmål). Microsoft Edge has good Norwegian voices built in, and so do most phones.")+'</div>';
  return h;
}

      (all||LS.show?t("Spill av så mange ganger du vil","Play as often as you like"):left?t(left+(left===1?" avspilling igjen":" avspillinger igjen"),left+(left===1?" play left":" plays left")):t("Ingen avspillinger igjen. Svar så godt du kan.","No plays left. Answer as best you can."))+'</div>';

  if(all||LS.show){

      c.lines.map(l=>'<p>'+(c.lines.length>1?'<span class="who">'+(l[0]==="k"?"👩":l[0]==="m"?"👨":"📢")+'</span>':'')+l[1]+'</p>').join("")+'</section>';
    const i=LISTEN.indexOf(c), nx=LISTEN[(i+1)%LISTEN.length];
    h+='<div class="row"><button class="sbtn primary" data-act="listen" data-v="'+nx.id+'">'+t("Neste oppgave","Next task")+' →</button><button class="sbtn" data-act="listen" data-v="'+c.id+'">'+t("Prøv igjen","Try again")+'</button></div>';
  }else h+='<div class="row"><button class="sbtn small ghost" data-act="lisshow">'+t("Jeg gir opp, vis teksten","I give up, show the text")+'</button></div>';

let CHK=null;   // which draft the "Sjekk teksten" results are showing for

/* ---- the simple text checker ----
   Looks for a handful of common B1–B2 mistakes with patterns. It's a hint list, not a grade. */
const CONNECT=["derfor","likevel","dessuten","i tillegg","derimot","imidlertid","fordi","selv om","siden","ettersom","på grunn av","til tross for","for eksempel","blant annet","alt i alt","til slutt","for det første","for det andre","på den ene siden","på den andre siden","samtidig","dermed","slik at","for at","først","deretter","etterpå","kort sagt","med andre ord","avslutningsvis","etter min mening","uansett","i stedet for","ifølge","følgelig","heldigvis","dessverre","når","hvis","mens"];
const W="(?<![\\p{L}])", WE="(?![\\p{L}])";   // word edges that understand æ, ø and å
const SUBJ="(jeg|du|han|hun|vi|dere|de|det|man|folk|mange|noen|barna|foreldrene)";
function snippet(s){const w=s.trim().split(/\s+/);return esc(w.slice(0,9).join(" ")+(w.length>9?" …":""))}
function checkText(txt,kind){
  const out=[], n=words(txt), tg=target(kind);
  out.push(n<tg[0]?["w",t("Teksten har "+n+" ord. Anbefalt er cirka "+(kind==="e"?"80 eller mer":"250–350")+".","The text has "+n+" words. Recommended: about "+(kind==="e"?"80 or more":"250–350")+".")]:["g",t(n+" ord. Bra lengde.",n+" words. Good length.")]);
  const paras=txt.split(/\n\s*\n/).filter(p=>p.trim()).length;
  if(kind==="a"&&paras<3) out.push(["w",t("Del teksten i avsnitt med en tom linje mellom: innledning, argumenter, avslutning.","Split the text into paragraphs with a blank line between: introduction, arguments, conclusion.")]);
  if(kind==="e"&&paras<2&&n>60) out.push(["w",t("Lag gjerne avsnitt, også i en e-post.","Use paragraphs, even in an email.")]);
  const used=CONNECT.filter(c=>new RegExp(W+c.replace(/ /g,"\\s+")+WE,"iu").test(txt));
  out.push(used.length>=5?["g",t("Du har brukt "+used.length+" ulike bindeord: ","You used "+used.length+" different linking words: ")+used.join(", ")+"."]:["w",t("Bare "+used.length+" ulike bindeord ("+(used.join(", ")||"ingen")+"). På B2 bør du variere mer: derfor, likevel, dessuten, i tillegg, selv om …","Only "+used.length+" different linking words ("+(used.join(", ")||"none")+"). For B2, vary more: derfor, likevel, dessuten, i tillegg, selv om …")]);
  const sentences=txt.split(/(?<=[.!?])\s+|\n+/).map(s=>s.trim()).filter(Boolean);
  const v2=new RegExp("^(derfor|likevel|dessuten|i tillegg|etterpå|deretter|heldigvis|dessverre|i dag|i morgen|i går|i fjor|til slutt|først|samtidig|ofte|noen ganger|for eksempel|på den ene siden|på den andre siden|etter min mening|alt i alt|i framtiden|nå|her|derimot|dermed|kanskje ikke)\\s*,?\\s+"+SUBJ+WE,"iu");
  sentences.forEach(s=>{const m=s.match(v2); if(m) out.push(["w",t("Ordstilling? Etter «"+esc(m[1])+"» skal verbet komme før subjektet (inversjon): ","Word order? After «"+esc(m[1])+"» the verb comes before the subject (inversion): ")+"<q>"+snippet(s)+"</q>"])});
  const biff=new RegExp(W+"(fordi|at|selv om|hvis|når|om|som|siden|mens|ettersom|dersom|slik at)\\s+("+SUBJ.slice(1,-1)+"|den|\\p{L}+(?:en|et|ene|a))\\s+(er|har|kan|vil|skal|må|bør|var|hadde|kunne|ville|skulle|måtte|burde|blir|ble|får|fikk|\\p{L}+(?:er|et|te|de))\\s+(ikke|aldri|alltid|også|ofte|bare|egentlig)"+WE,"giu");
  (txt.match(biff)||[]).forEach(m=>out.push(["w",t("Leddsetning: «ikke/aldri/også …» skal stå foran verbet (BIFF): ","Subordinate clause: «ikke/aldri/også …» goes before the verb (BIFF): ")+"<q>"+esc(m)+"</q>"]));
  const modal=new RegExp(W+"(kan|kunne|må|måtte|skal|skulle|vil|ville|bør|burde)\\s+(ikke\\s+)?å"+WE,"giu");
  (txt.match(modal)||[]).forEach(m=>out.push(["w",t("Ingen «å» etter modalverb: ","No «å» after a modal verb: ")+"<q>"+esc(m)+"</q>"]));
  const og=new RegExp(W+"(liker|prøver|prøvde|begynner|begynte|slutter|elsker|pleier|ønsker|håper|glemmer|glemte|trenger|planlegger|husker|for|lyst til|tid til|bestemte meg for)\\s+og\\s+\\p{L}+","giu");
  (txt.match(og)||[]).forEach(m=>out.push(["w",t("Skal det være «å» her? ","Should this be «å»? ")+"<q>"+esc(m)+"</q>"]));
  const aa=new RegExp(W+"å\\s+"+SUBJ+"\\s+\\p{L}+","giu");
  (txt.match(aa)||[]).forEach(m=>out.push(["w",t("Skal det være «og» her? ","Should this be «og»? ")+"<q>"+esc(m)+"</q>"]));
  const caps=/([\p{Ll},]\s+)(Mandag|Tirsdag|Onsdag|Torsdag|Fredag|Lørdag|Søndag|Januar|Februar|Mars|April|Mai|Juni|Juli|August|September|Oktober|November|Desember|Norsk|Engelsk|Arabisk|Polsk|Somalisk|Spansk|Fransk|Tysk|Ukrainsk|Russisk|Persisk|Tyrkisk|Litauisk|Svensk|Dansk|Nordmann|Nordmenn)(?![\p{L}])/gu;
  let mm; const seen={}; while((mm=caps.exec(txt))){if(!seen[mm[2]]){seen[mm[2]]=1;out.push(["w",t("Liten forbokstav i dager, måneder, språk og nasjonaliteter: ","Lowercase for days, months, languages and nationalities: ")+"<q>"+esc(mm[2])+"</q> → <q>"+esc(mm[2].toLowerCase())+"</q>"])}}
  if(/,\s*at(?![\p{L}])/iu.test(txt)) out.push(["w",t("Vanligvis skal det ikke være komma foran «at».","Usually no comma before «at».")]);
  const dem=new RegExp(W+"(med|til|for|av|hos|fra|uten|mellom|ved|om|på)\\s+de\\s*[.,!?]","giu");
  (txt.match(dem)||[]).forEach(m=>out.push(["w",t("Etter preposisjon: «dem», ikke «de»: ","After a preposition: «dem», not «de»: ")+"<q>"+esc(m)+"</q>"]));
  sentences.forEach(s=>{if(words(s)>40) out.push(["w",t("Veldig lang setning. Del den gjerne opp: ","Very long sentence. Consider splitting it: ")+"<q>"+snippet(s)+"</q>"])});
  if(sentences.length>=6){const j=sentences.filter(s=>/^jeg(?![\p{L}])/iu.test(s)).length; if(j/sentences.length>=0.45) out.push(["w",t("Mange setninger starter med «Jeg». Varier: «Derfor …», «Etter min mening …», «I tillegg …» – og husk inversjon.","Many sentences start with «Jeg». Vary it: «Derfor …», «Etter min mening …», «I tillegg …» – and remember inversion.")])}
  return out;
}

function beep(){try{const a=new (window.AudioContext||window.webkitAudioContext)(),o=a.createOscillator(),g=a.createGain();o.frequency.value=880;g.gain.value=.15;o.connect(g);g.connect(a.destination);o.start();o.stop(a.currentTime+.25);setTimeout(()=>a.close(),400)}catch(e){}}

  h+='<div class="row">'+(K.flip?'<button class="sbtn primary" data-act="cardyes">'+t("Kunne det","Knew it")+'</button><button class="sbtn" data-act="cardno">'+t("Øv mer","Need practice")+'</button>':'<button class="sbtn primary" data-act="flip">'+t("Vis svar","Show answer")+'</button><button class="sbtn ghost" data-act="cardskip">'+t("Hopp over","Skip")+'</button>')+
    (canSpeak&&(fwd||K.flip)?'<button class="sbtn ghost" data-act="cardsay">🔊 '+t("Uttale","Pronounce")+'</button>':'')+'</div>';
  h+='<p class="muted small" style="margin:0">'+t("Tastatur: mellomrom snur kortet.","Keyboard: space flips the card.")+'</p>';
  return h;
}

const VIEWS={plan:viewPlan,gram:viewGram,lese:viewLese,lytte:viewLytte,skrive:viewSkrive,snakke:viewSnakke,ord:viewOrd};

/* ---------- the one-second clock (writing test set + speaking timer) ---------- */
let tickId=null;
function startTicker(){
  if(tickId) return;
  tickId=setInterval(()=>{
    const wx=S.wx&&!S.wx.done, sp=SPT.ph>=0&&SPT.ph<SP_TYPES[S.sp.t].phases.length;
    if(!wx&&!sp){clearInterval(tickId);tickId=null;return}
    if(wx){const r=wxLeft(),el=document.getElementById("wtimer");
      if(el){el.textContent=fmt(r);el.classList.toggle("low",r<600)}
      if(r<=0) finishWx();}
    if(sp){const r=spLeft(),el=document.getElementById("stimer");
      if(el){el.textContent=(r<0?"+":"")+fmt(Math.abs(r));el.classList.toggle("over",r<0)}
      if(r<=0&&!SPT.over){SPT.over=true;beep()}}
  },1000);
}

/* ---------- actions (every button has data-act="name" and maybe data-v="value") ---------- */
function go(tab){if(tab!==S.tab){stopSpeak();if(LS)LS.playing=false}S.tab=tab;save();render();window.scrollTo(0,0)}
const ACT={
  lang(v){S.lang=v;save();render()},
  tab(v){go(v)},
  day(v){S.days[v]=!S.days[v];saveProgress();render()},
  // grammar
  gtopic(v){S.gr=v;save();render()},
  gram(v){S.gSel=[v];if(v!=="all")S.gr=v;startDrill(S.gSel,false);go("gram")},
  drillweak(){S.gSel=["all"];startDrill(["all"],true);go("gram")},
  gagain(){startDrill(S.gSel,P&&P.weakOnly);render()},
  gquit(){P=null;render();window.scrollTo(0,0)},
  pick(v){
    if(!P||P.ans!==null) return;
    const a=+v, id=P.queue[P.i], ok=a===0;
    P.ans=a; P.done++; if(ok)P.right++; record(id,ok);
    if(!ok&&!P.requeued[id]){P.requeued[id]=1;P.queue.splice(Math.min(P.queue.length,P.i+5),0,id)}
    render(); const n=document.getElementById("nextbtn"); if(n) n.focus({preventScroll:true});
  },
  next(){if(!P)return;P.i++;P.ans=null;
    if(P.i<P.queue.length) P.order=shuffle(range(qById[P.queue[P.i]].o.length));
    render();window.scrollTo(0,0)},
  // reading
  read(v){openRead(v);go("lese")},
  readclose(){RD=null;render();window.scrollTo(0,0)},
  rpick(v){const p=v.split(":"),n=+p[0],oi=+p[1];if(!RD||RD.ans[n]!==undefined)return;RD.ans[n]=oi;record(readById[RD.id].qs[n].id,oi===0);render()},
  // listening
  listen(v){openListen(v);go("lytte")},
  lisclose(){stopSpeak();LS=null;render();window.scrollTo(0,0)},
  lisplay(){const c=lisById[LS.id];const all=Object.keys(LS.ans).length===c.qs.length;
    if(!all&&!LS.show&&LS.plays>=maxPlays(c))return;
    if(!all&&!LS.show)LS.plays++;
    LS.playing=true;render();
    const id=LS.id; speak(c.lines,()=>{if(LS&&LS.id===id){LS.playing=false;render()}})},
  lisstop(){stopSpeak();if(LS)LS.playing=false;render()},
  lisshow(){LS.show=true;render()},
  lpick(v){const p=v.split(":"),n=+p[0],oi=+p[1];if(!LS||LS.ans[n]!==undefined)return;LS.ans[n]=oi;record(lisById[LS.id].qs[n].id,oi===0);render()},
  // writing
  write(v){S.wt=null;S.wview=null;go("skrive");const el=document.querySelectorAll(".modlabel")[v==="a"?1:0];if(el)el.scrollIntoView({block:"start"})},
  wtask(v){const p=v.split(":");S.wt={kind:p[0],id:p[1]};S.wview=null;CHK=null;save();render();window.scrollTo(0,0)},
  wclose(){S.wt=null;CHK=null;save();render();window.scrollTo(0,0)},
  wcheck(){CHK="p-"+S.wt.id;render();const c=document.getElementById("checkout");if(c)c.scrollIntoView({block:"start",behavior:"smooth"})},
  wclear(){if(!confirm(t("Slette alt du har skrevet på denne oppgaven?","Delete everything you've written for this task?")))return;delete S.drafts["p-"+S.wt.id];CHK=null;save();render()},
  async wsave(){const w=S.wt,key="p-"+w.id,txt=S.drafts[key]||"";
    if(!words(txt)){alert(t("Skriv noe først.","Write something first."));return}
    const id=await saveText(w.kind,w.id,txt,false,null);
    delete S.drafts[key];S.wt=null;S.wview=id;CHK=null;save();render();window.scrollTo(0,0)},
  wview(v){S.wview=v;S.wt=null;save();render();window.scrollTo(0,0)},
  wviewclose(){S.wview=null;save();render();window.scrollTo(0,0)},
  wdel(){if(!confirm(t("Slette denne teksten for godt?","Delete this text for good?")))return;store.remove("texts",S.wview);S.wview=null;save();render()},
  wfb(){const el=document.getElementById("fbin"),txt=(el&&el.value||"").trim();if(!txt)return;
    const x=TEXTS[S.wview];store.update("texts",S.wview,{fb:(x.fb||[]).concat({by:meId,ts:Date.now(),text:txt})});el.value=""},
  wexam(){if(S.wx&&!S.wx.done&&!confirm(t("Starte et nytt prøvesett? Det du har skrevet nå, blir borte.","Start a new test set? What you've written now will be lost.")))return;newWx();S.wt=null;S.wview=null;go("skrive")},
  wxtab(v){S.wx.cur=+v;S.wx.confirm=false;save();render()},
  wxpick(v){S.wx.t2=v;save();render()},
  wxsubmit(){S.wx.confirm=true;save();render();const c=document.querySelector(".confirm");if(c)c.scrollIntoView({block:"center"})},
  wxcancel(){S.wx.confirm=false;save();render()},
  wxconfirm(){finishWx();window.scrollTo(0,0)},
  wxabort(){if(!confirm(t("Avbryte prøvesettet? Tekstene blir ikke lagret.","Abandon the test set? The texts won't be saved.")))return;S.wx=null;save();render()},
  wxdone(){S.wx=null;S.drafts.x1="";S.drafts.x2="";save();render();window.scrollTo(0,0)},
  // speaking
  speak(v){S.sp={t:v,i:Math.floor(Math.random()*SP_TYPES[v].list.length)};SPT={ph:-1,end:0,over:false};save();go("snakke")},
  sptype(v){stopSpeak();S.sp={t:v,i:Math.floor(Math.random()*SP_TYPES[v].list.length)};SPT={ph:-1,end:0,over:false};save();render()},
  spnew(){stopSpeak();const n=SP_TYPES[S.sp.t].list.length;let i=S.sp.i;if(n>1)while(i===S.sp.i)i=Math.floor(Math.random()*n);S.sp.i=i;SPT={ph:-1,end:0,over:false};save();render()},
  spreset(){SPT={ph:-1,end:0,over:false};render()},
  spgo(){const ph=SP_TYPES[S.sp.t].phases;SPT.ph++;SPT.over=false;
    if(SPT.ph<ph.length)SPT.end=Date.now()+ph[SPT.ph][1]*1000;
    else{S.spk=(S.spk||0)+1;saveProgress()}
    render()},
  spsay(){speak([["n",spItem().q]])},
  spsayf(v){speak([["m",spItem().f[+v]]])},
  rec(){toggleRec()},
  // word cards
  deck(v){S.deck=v;K=null;save();go("ord")},
  dir(v){S.dir=v;save();render()},
  cardsre(){K=null;render()},
  flip(){K.flip=!K.flip;render()},
  cardyes(){record(K.ids[K.i],true);K.known++;K.i++;K.flip=false;render()},
  cardno(){const id=K.ids[K.i];record(id,false);K.ids.splice(Math.min(K.ids.length,K.i+6),0,id);K.i++;K.flip=false;render()},
  cardskip(){K.i++;K.flip=false;render()},
  cardsay(){const c=cardById[K.ids[K.i]];speak([["n",c.nb]].concat(K.flip?[["n",c.ex]]:[]))}
};
document.addEventListener("click",e=>{const b=e.target.closest("[data-act]");if(!b||b.disabled)return;const f=ACT[b.dataset.act];if(f)f(b.dataset.v,b)});
// Settings in <select>/<input> elements (voice, speed, practice mode).
document.addEventListener("change",e=>{const el=e.target.closest("[data-chg]");if(!el)return;
  const k=el.dataset.chg;
  if(k==="voice")S.voice=el.value; else if(k==="rate")S.rate=+el.value; else if(k==="lsfree")S.lsFree=el.checked;
  save();render()});
// Keyboard: 1–4 answer, Enter / → next (grammar), Space flips a word card.
document.addEventListener("keydown",e=>{
  if(e.target.closest("input,select,textarea")||e.metaKey||e.ctrlKey||e.altKey) return;
  if((e.key===" "||e.key==="Enter")&&e.target.closest("button")) return;
  const k=e.key;
  if(S.tab==="gram"&&P&&P.i<P.queue.length){
    if(P.ans===null&&/^[1-9]$/.test(k)&&+k<=P.order.length){ACT.pick(String(P.order[+k-1]));e.preventDefault()}
    else if(P.ans!==null&&(k==="Enter"||k==="ArrowRight")){ACT.next();e.preventDefault()}
  }else if(S.tab==="ord"&&K&&K.i<K.ids.length){
    if(k===" "){ACT.flip();e.preventDefault()}
  }
});
// Tidy up anything left over from an older visit.
if(S.wx&&!S.wx.done&&(!emailById[S.wx.t1]||wxLeft()<=0)){if(emailById[S.wx.t1])finishWx();else S.wx=null}
if(S.wt&&!(S.wt.kind==="e"?emailById[S.wt.id]:argById[S.wt.id])) S.wt=null;
if(!SP_TYPES[S.sp.t]) S.sp={t:"paa",i:0};
if(!chById[S.gr]) S.gr="ord";
if(S.deck!=="all"&&!deckById[S.deck]) S.deck="kon";
if(!VIEWS[S.tab]) S.tab="plan";
render();
})();
</script>
