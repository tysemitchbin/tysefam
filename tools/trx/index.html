<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>TRX Training</title>

<!-- ════════════════════════════════════════════════════════════════
     TRX TRAINING: an exercise database with simple diagrams, ready-made
     workouts, your own workouts and a timer that talks you through them.
     The words live in data.js, the diagrams in illus.js; this file is the app.

     Four tabs: Exercises · Workouts · Build · Log

     Saved in Family.store('trx'), shared by everyone in the family:
       workouts → <id>: { name, emoji, rounds, work, rest, roundRest, list: [exercise ids], ts, by }
                        workouts the family made in the Build tab
       log      → <id>: { name, wid, secs, date: 'YYYY-MM-DD', ts, by }
                        one row per finished workout
     Saved on this device only: the open tab, the exercise filters, the
     workout you're building, and the sound/voice switches.
═════════════════════════════════════════════════════════════════ -->

<link rel="stylesheet" href="../../shared/family.css">
<style>
:root{
  --accent:var(--peach-deep); --accent-soft:#fdeede;
  --good:var(--meadow-deep); --good-soft:#e3f1df;
  --sunk:#eef0e8; --rr:16px;
}
body{line-height:1.5}
h1,h2,h3,h4{font-family:"Fredoka",system-ui,sans-serif;font-weight:600;color:var(--forest);line-height:1.2;margin:0}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:6px}
p{margin:.4em 0}

/* header: title + tabs, stuck to the top */
.top{position:sticky;top:0;z-index:10;background:var(--cream);border-bottom:1px solid var(--line)}
.top-in{max-width:980px;margin:0 auto;padding:12px 16px 0;display:flex;flex-direction:column;gap:8px}
.brand{display:flex;align-items:center;gap:10px;justify-content:space-between;flex-wrap:wrap}
.brand-l{display:flex;align-items:center;gap:10px;min-width:0}
.brand-l .mark{font-size:1.7rem;line-height:1}
.brand h1{font-size:1.25rem}
.brand small{display:block;font-size:.78rem;color:var(--ink-soft)}
.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{background:none;border:0;padding:8px 12px 10px;color:var(--ink-soft);font-weight:700;border-bottom:3px solid transparent;white-space:nowrap;font-size:.95rem}
@media(max-width:420px){.tab{padding:8px 7px 10px;font-size:.88rem}}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.tab:hover{color:var(--ink)}
.tab .count[hidden]{display:none}
.tab .count{display:inline-block;min-width:18px;padding:0 5px;margin-left:4px;border-radius:999px;background:var(--accent);color:#fff;font-size:.72rem;line-height:18px}

main.view{max-width:980px;margin:0 auto;padding:20px 16px 72px;display:flex;flex-direction:column;gap:18px}
.box{background:var(--paper);border:1px solid var(--line);border-radius:var(--rr);padding:18px;box-shadow:var(--shadow)}
.box > h3{font-size:1.15rem;margin-bottom:10px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.muted{color:var(--ink-soft)}
.small{font-size:.86rem}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:2px solid var(--line);background:#fff;color:var(--forest);border-radius:999px;padding:5px 11px;font-weight:800;font-size:.85rem}
.chip[aria-pressed="true"]{background:var(--meadow);border-color:var(--meadow);color:#fff}
.pill{display:inline-block;font-size:.72rem;font-weight:800;padding:2px 9px;border-radius:999px;background:var(--sunk);color:var(--ink-soft);white-space:nowrap}
.pill.l1{background:var(--good-soft);color:var(--good)}
.pill.l2{background:#fcf3d2;color:#a87a10}
.pill.l3{background:#fdeceb;color:#c2453a}
.pill.len{background:#e4f2f5;color:#3d7f90}
.field,select.field{border:2px solid var(--line);background:#fff;border-radius:12px;padding:9px 11px;outline:none;min-width:0}
.field:focus{border-color:var(--meadow)}
ul.clean,ol.clean{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:5px}
.empty{text-align:center;color:var(--ink-soft);padding:22px 8px;font-style:italic}
.empty .big{font-size:2rem;display:block;margin-bottom:6px;font-style:normal}

/* the diagrams */
svg.illus{display:block;width:100%;height:auto}
.pic{background:#fff;border-radius:12px;border:1px solid var(--line)}

/* basics box */
details.basics summary{cursor:pointer;font-family:"Fredoka",sans-serif;font-weight:600;color:var(--forest);font-size:1.1rem;list-style:none;display:flex;align-items:center;gap:8px}
details.basics summary::-webkit-details-marker{display:none}
details.basics summary::after{content:"▾";margin-left:auto;color:var(--ink-soft);transition:.2s}
details.basics[open] summary::after{transform:rotate(180deg)}
.basics-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:12px}
@media(max-width:720px){.basics-grid{grid-template-columns:1fr}}
.lenlist{display:flex;flex-direction:column;gap:6px;margin-top:8px;font-size:.9rem}
.lenlist b{display:inline-block;min-width:30px;color:#3d7f90}
.tips{display:flex;flex-direction:column;gap:8px;font-size:.92rem}
.tips b{color:var(--forest)}

/* exercise grid */
.filters{display:flex;flex-direction:column;gap:10px}
.filters .row .field{flex:1 1 200px}
.exgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.excard{background:var(--paper);border:1px solid var(--line);border-radius:var(--rr);padding:10px;box-shadow:var(--shadow);text-align:left;color:inherit;display:flex;flex-direction:column;gap:8px;transition:.15s;position:relative}
.excard:hover{transform:translateY(-2px);box-shadow:var(--shadow-lg)}
.excard .nmrow{display:flex;align-items:center;gap:8px}
.excard .nm{font-family:"Fredoka",sans-serif;font-weight:600;color:var(--forest);font-size:1.05rem;flex:1;min-width:0}
.excard .tags{display:flex;gap:5px;flex-wrap:wrap}
.excard .mus{font-size:.82rem;color:var(--ink-soft)}
.excard .plus{flex:0 0 auto;border:0;border-radius:999px;width:32px;height:32px;background:var(--accent);color:#fff;font-weight:800;font-size:1.1rem;box-shadow:var(--shadow)}
.excard .plus:hover{filter:brightness(.95)}

/* exercise detail popup */
dialog{border:0;border-radius:20px;padding:0;max-width:640px;width:calc(100% - 24px);max-height:calc(100vh - 32px);background:var(--paper);box-shadow:var(--shadow-lg);color:var(--ink)}
dialog::backdrop{background:rgba(60,65,56,.45)}
.dlg{padding:18px;display:flex;flex-direction:column;gap:12px}
.dlg-head{display:flex;align-items:flex-start;gap:10px}
.dlg-head h2{font-size:1.4rem;flex:1}
.xbtn{border:0;background:var(--sunk);border-radius:999px;width:34px;height:34px;font-size:1.1rem;color:var(--ink-soft);flex:0 0 auto}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px}
.fact{background:var(--sunk);border-radius:12px;padding:8px 10px;font-size:.86rem}
.fact span{display:block;font-size:.7rem;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-soft)}
.dlg h4{font-size:1rem;margin-top:4px}
.ezhd{display:grid;grid-template-columns:1fr 1fr;gap:8px}
@media(max-width:520px){.ezhd{grid-template-columns:1fr}}
.ezhd div{border-radius:12px;padding:10px 12px;font-size:.9rem}
.ezhd .ez{background:var(--good-soft)} .ezhd .hd{background:var(--accent-soft)}
.ezhd b{display:block;font-size:.78rem;text-transform:uppercase;letter-spacing:.05em}

/* workout cards */
.wgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:12px}
.wcard{background:var(--paper);border:1px solid var(--line);border-radius:var(--rr);padding:14px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:8px}
.wcard .hd{display:flex;align-items:center;gap:10px}
.wcard .em{font-size:1.7rem;width:46px;height:46px;border-radius:14px;background:var(--accent-soft);display:grid;place-items:center;flex:0 0 auto}
.wcard h3{font-size:1.1rem}
.wcard .sub{font-size:.8rem;color:var(--ink-soft);font-weight:700}
.wcard .mini{display:flex;gap:4px;flex-wrap:wrap}
.wcard .mini span{font-size:.76rem;font-weight:700;background:var(--sunk);border-radius:8px;padding:2px 7px}
.wcard .acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:auto;padding-top:4px}
.section-title{display:flex;align-items:center;gap:8px;font-size:1.15rem}

/* builder */
.bform{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.bform label{display:flex;flex-direction:column;gap:4px;font-weight:800;font-size:.8rem;color:var(--ink-soft)}
.bform label.wide{grid-column:1 / -1}
.emojis{display:flex;gap:4px;flex-wrap:wrap}
.emojis button{border:2px solid var(--line);background:#fff;border-radius:10px;font-size:1.2rem;width:40px;height:40px;padding:0}
.emojis button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.blist{display:flex;flex-direction:column;gap:6px;margin:0;padding:0;list-style:none}
.bitem{display:grid;grid-template-columns:24px 64px 1fr auto;gap:10px;align-items:center;border:1px solid var(--line);background:#fff;border-radius:12px;padding:6px 8px}
.bitem .n{font-weight:800;color:var(--ink-soft);text-align:center}
.bitem .t{font-weight:800;color:var(--forest);line-height:1.2}
.bitem .t small{display:block;font-weight:700;color:var(--ink-soft);font-size:.75rem}
.bitem .ctl{display:flex;gap:2px}
.bitem .ctl button{border:0;background:var(--sunk);border-radius:8px;width:30px;height:30px;font-size:.9rem;color:var(--ink-soft)}
.bitem .ctl button:hover{background:var(--line)}
.bitem .ctl button:disabled{opacity:.35}
.strapchg{font-size:.76rem;font-weight:800;color:#3d7f90;padding:0 0 0 40px}
@media(max-width:420px){.bitem{gap:7px;padding:5px 6px}.bitem .ctl button{width:27px;height:30px}}
.summary{display:flex;gap:8px;flex-wrap:wrap}
.summary .pill{font-size:.8rem;padding:4px 11px}

/* log */
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;text-align:center}
.week .d{border-radius:12px;padding:6px 0;background:var(--sunk);font-size:.75rem;font-weight:800;color:var(--ink-soft)}
.week .d b{display:block;font-family:"Fredoka",sans-serif;font-size:1.1rem}
.week .d.some{background:var(--accent-soft);color:#b8693b}
.week .d.today{outline:2px solid var(--accent);outline-offset:-2px}
.people{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.person{background:var(--sunk);border-radius:14px;padding:12px}
.person .big{font-family:"Fredoka",sans-serif;font-size:1.8rem;color:var(--forest)}
.logrow{display:flex;gap:10px;align-items:center;padding:9px 2px;border-bottom:1px dashed var(--line)}
.logrow:last-child{border-bottom:0}
.logrow .em{font-size:1.3rem}
.logrow .txt{flex:1;min-width:0}

/* toast */
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(120px);background:var(--forest);color:#fff;font-weight:800;font-size:.88rem;padding:8px 16px;width:max-content;border-radius:999px;box-shadow:var(--shadow-lg);transition:.25s;z-index:400;max-width:calc(100% - 32px);text-align:center}
.toast.show{transform:translateX(-50%) translateY(0)}

/* ───── the workout player (full screen) ───── */
.player{position:fixed;inset:0;z-index:500;background:var(--cream);display:none;flex-direction:column}
.player.open{display:flex}
.pl-top{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line);background:var(--paper)}
.pl-top .nm{font-family:"Fredoka",sans-serif;font-weight:600;color:var(--forest);flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pl-top .tog{border:2px solid var(--line);background:#fff;border-radius:999px;padding:4px 10px;font-weight:800;font-size:.85rem}
.pl-top .tog[aria-pressed="false"]{opacity:.45}
.pl-bar{height:6px;background:var(--sunk)}
.pl-bar i{display:block;height:100%;width:0;background:var(--accent);transition:width .25s linear}
.pl-main{flex:1;overflow:auto;display:flex;flex-direction:column;align-items:center;gap:10px;padding:14px 16px;max-width:720px;width:100%;margin:0 auto}
.pl-phase{font-family:"Fredoka",sans-serif;font-weight:700;letter-spacing:.12em;font-size:.95rem;padding:4px 14px;border-radius:999px;background:var(--sunk);color:var(--ink-soft)}
.pl-phase.work{background:var(--accent);color:#fff}
.pl-phase.rest{background:var(--sky);color:#2f6b7a}
.pl-phase.ready{background:var(--sun);color:#7a5c00}
.pl-phase.done{background:var(--meadow);color:#fff}
.pl-time{font-family:"Fredoka",sans-serif;font-weight:600;font-size:clamp(4rem,18vw,7rem);line-height:1;color:var(--forest);font-variant-numeric:tabular-nums}
.pl-ex{font-family:"Fredoka",sans-serif;font-weight:600;font-size:1.5rem;color:var(--forest);text-align:center}
.pl-where{font-size:.85rem;color:var(--ink-soft);font-weight:700;text-align:center}
.pl-pic{width:100%;max-width:560px}
.pl-cue{font-size:.95rem;text-align:center;max-width:52ch}
.pl-strap{background:#e4f2f5;color:#2f6b7a;border-radius:12px;padding:8px 14px;font-weight:800;text-align:center}
.pl-side{background:var(--accent-soft);color:#b8693b;border-radius:12px;padding:6px 14px;font-weight:800}
.pl-next{font-size:.88rem;color:var(--ink-soft);font-weight:700}
.pl-ctl{display:flex;gap:12px;justify-content:center;padding:14px 16px calc(14px + env(safe-area-inset-bottom));border-top:1px solid var(--line);background:var(--paper)}
.pl-ctl button{border:0;border-radius:999px;width:56px;height:56px;font-size:1.3rem;background:var(--sunk);color:var(--forest)}
.pl-ctl button.main{width:72px;height:72px;font-size:1.7rem;background:var(--accent);color:#fff}
</style>
</head>
<body data-tool="trx">

<header class="top">
  <div class="top-in">
    <div class="brand">
      <div class="brand-l"><span class="mark">🏋️</span><div><h1>TRX Training</h1><small>Suspension-strap exercises, workouts and a timer</small></div></div>
      <span id="sync" class="badge local">…</span>
    </div>
    <nav class="tabs" role="tablist">
      <button class="tab" role="tab" data-tab="exercises">📖 Exercises</button>
      <button class="tab" role="tab" data-tab="workouts">🔥 Workouts</button>
      <button class="tab" role="tab" data-tab="build">🛠️ Build<span class="count" id="draftCount" hidden></span></button>
      <button class="tab" role="tab" data-tab="log">📈 Log</button>
    </nav>
  </div>
</header>

<main class="view" id="view"></main>

<dialog id="dlg"></dialog>
<div class="toast" id="toast"></div>

<!-- the full-screen timer -->
<div class="player" id="player" aria-live="polite">
  <div class="pl-top">
    <span class="nm" id="plName"></span>
    <button class="tog" id="plSound" title="Beeps">🔔</button>
    <button class="tog" id="plVoice" title="Read the exercise names out loud">🗣️</button>
  </div>
  <div class="pl-bar"><i id="plBar"></i></div>
  <div class="pl-main" id="plMain"></div>
  <div class="pl-ctl">
    <button id="plBack" title="Back">⏮</button>
    <button id="plPlay" class="main" title="Pause">⏸</button>
    <button id="plSkip" title="Skip">⏭</button>
    <button id="plQuit" title="Stop">✕</button>
  </div>
</div>

<script src="../../site.js"></script>
<script src="../../shared/family.js"></script>
<script src="data.js"></script>
<script src="illus.js"></script>
<script>
const TOOL_ID = 'trx';
const store = Family.store(TOOL_ID);
const esc = Family.esc;
const $ = s => document.querySelector(s);
const D = window.TRX_DATA;
const EX = Object.fromEntries(D.EXERCISES.map(e => [e.id, e]));   // look up an exercise by id
const pic = (id, title, small) => window.TRX_ILLUS.draw(id, title, small);   // small = just the finish pose

/* ───────── little helpers ───────── */
// This device's own settings (tab, filters, draft…). Never breaks if storage is blocked.
const local = {
  get(k, d) { try { const v = localStorage.getItem('trx:' + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem('trx:' + k, JSON.stringify(v)); } catch (e) { /* fine */ } }
};
const pad = n => String(n).padStart(2, '0');
const dayKey = d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
const mins = secs => Math.max(1, Math.round(secs / 60)) + ' min';
const clock = secs => Math.floor(secs / 60) + ':' + pad(Math.floor(secs % 60));
const levelPill = l => `<span class="pill l${l}">${D.LEVELS[l]}</span>`;
const lenPill = k => `<span class="pill len" title="${esc(D.LENGTHS[k].name)}">📏 ${esc(D.LENGTHS[k].name)}</span>`;
function toast(msg) {
  const t = $('#toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toast.h); toast.h = setTimeout(() => t.classList.remove('show'), 2200);
}

/* ───────── saved data ───────── */
let MINE = {};     // the family's own workouts
let LOG = {};      // finished workouts
store.ready.then(() => {
  const cloud = store.mode === 'cloud';
  $('#sync').className = 'badge ' + (cloud ? 'ok' : 'local');
  $('#sync').textContent = cloud ? '☁️ Synced' : '📴 This device only';
});
store.watch('workouts', items => { MINE = items; if (TAB === 'workouts' || TAB === 'log') render(); });
store.watch('log', items => { LOG = items; if (TAB === 'log') render(); });

/* ───────── the timeline of a workout ─────────
   Turns { rounds, work, rest, roundRest, list } into steps for the timer:
     { kind: 'ready' | 'work' | 'rest', secs, ex, round, i }
   (rest steps carry the exercise that comes next). */
function timeline(w) {
  const steps = [];
  const list = (w.list || []).filter(id => EX[id]);
  if (!list.length) return steps;
  steps.push({ kind: 'ready', secs: 10, ex: list[0], round: 1, i: 0 });
  for (let r = 1; r <= w.rounds; r++) {
    list.forEach((id, i) => {
      steps.push({ kind: 'work', secs: w.work, ex: id, round: r, i });
      const lastInRound = i === list.length - 1, lastRound = r === w.rounds;
      if (lastInRound && lastRound) return;
      const secs = lastInRound ? (w.roundRest || w.rest) : w.rest;
      const next = lastInRound ? list[0] : list[i + 1];
      if (secs > 0) steps.push({ kind: 'rest', secs, ex: next, round: lastInRound ? r + 1 : r, i: lastInRound ? 0 : i + 1, between: lastInRound });
    });
  }
  return steps;
}
const totalSecs = w => timeline(w).reduce((s, st) => s + st.secs, 0);
// How many times you have to change the strap length, going through the list once.
const strapChanges = list => list.filter(id => EX[id]).reduce((n, id, i, a) => n + (i && EX[id].len !== EX[a[i - 1]].len ? 1 : 0), 0);

/* ───────── tabs ───────── */
let TAB = local.get('tab', 'exercises');
document.querySelectorAll('.tab').forEach(b => b.onclick = () => go(b.dataset.tab));
function go(tab) { TAB = tab; local.set('tab', tab); render(); window.scrollTo(0, 0); }
function render() {
  document.querySelectorAll('.tab').forEach(b => b.setAttribute('aria-selected', b.dataset.tab === TAB));
  const v = $('#view');
  v.innerHTML = ({ exercises: viewExercises, workouts: viewWorkouts, build: viewBuild, log: viewLog }[TAB] || viewExercises)();
  const n = DRAFT.list.length;
  $('#draftCount').hidden = !n; $('#draftCount').textContent = n;
}

/* ═════════ EXERCISES ═════════ */
let F = Object.assign({ q: '', cat: 'all', level: 0, len: 'all' }, local.get('filters', {}));
function viewExercises() {
  const chip = (key, val, label) => `<button class="chip" data-f="${key}" data-v="${val}" aria-pressed="${String(F[key]) === String(val)}">${label}</button>`;
  return `
  <details class="box basics"${local.get('basicsOpen', false) ? ' open' : ''}>
    <summary>📏 Strap lengths and the basics</summary>
    <div class="basics-grid">
      <div>
        <div class="pic">${window.TRX_ILLUS.lengths()}</div>
        <div class="lenlist">${Object.entries(D.LENGTHS).map(([k, l]) => `<div><b>${k}</b> <strong>${esc(l.name)}.</strong> ${esc(l.how)}</div>`).join('')}</div>
        <p class="small muted">${esc(D.LENGTH_NOTE)}</p>
      </div>
      <div class="tips">${D.BASICS.map(([t, d]) => `<div><b>${esc(t)}</b> ${esc(d)}</div>`).join('')}
        <p class="small muted">In the diagrams the anchor is at the top and the yellow bits are the handles or foot cradles. Start on the left, finish on the right. Most are seen from the side; sideways and twisting moves are seen from the front (or from above), and say so under the picture.</p>
      </div>
    </div>
  </details>

  <div class="filters">
    <div class="row">
      <input class="field" id="q" placeholder="🔎 Search: row, glutes, plank…" value="${esc(F.q)}">
      <select class="field" id="flen" style="flex:0 1 200px">
        <option value="all">Any strap length</option>
        ${Object.entries(D.LENGTHS).map(([k, l]) => `<option value="${k}"${F.len === k ? ' selected' : ''}>${esc(l.name)}</option>`).join('')}
      </select>
    </div>
    <div class="chips">${chip('cat', 'all', 'All')}${Object.entries(D.CATS).map(([k, c]) => chip('cat', k, c.emoji + ' ' + c.name)).join('')}</div>

/* ═════════ THE TIMER ═════════
   Steps through the timeline: a 10-second "get ready", then work and
   rest in turn. Beeps on the last 3 seconds and when a phase changes,
   and can read the next exercise out loud. Keeps the screen awake. */
const PL = { w: null, steps: [], at: 0, left: 0, running: false, finished: false, endAt: 0, tick: null, done: 0, sideSaid: false, wake: null };
let SOUND = local.get('sound', true), VOICE = local.get('voice', true);
let audio = null;
function beep(freq = 880, len = 0.12) {
  if (!SOUND) return;
  try {
    audio = audio || new (window.AudioContext || window.webkitAudioContext)();
    const o = audio.createOscillator(), g = audio.createGain();
    o.frequency.value = freq; o.connect(g); g.connect(audio.destination);
    g.gain.setValueAtTime(0.25, audio.currentTime); g.gain.exponentialRampToValueAtTime(0.001, audio.currentTime + len);
    o.start(); o.stop(audio.currentTime + len);
  } catch (e) { /* no sound on this device */ }
}
function say(text) {
  if (!VOICE || !window.speechSynthesis) return;
  try { speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(text); u.lang = 'en-GB'; u.rate = 1.02; speechSynthesis.speak(u); } catch (e) { /* fine */ }
}
async function keepAwake(on) {
  try {
    if (on && 'wakeLock' in navigator && !PL.wake) { PL.wake = await navigator.wakeLock.request('screen'); PL.wake.addEventListener('release', () => { PL.wake = null; }); }
    if (!on && PL.wake) { await PL.wake.release(); PL.wake = null; }
  } catch (e) { /* not allowed here: fine */ }
}
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && PL.running) keepAwake(true); });

function startWorkout(w) {
  const steps = timeline(w);
  if (!steps.length) { toast('That workout has no exercises yet.'); return; }
  // wake the audio up now, while we're inside a tap (phones need that)
  try { audio = audio || new (window.AudioContext || window.webkitAudioContext)(); audio.resume(); } catch (e) { /* fine */ }
  Object.assign(PL, { w, steps, at: 0, done: 0, running: true, finished: false });
  $('#plName').textContent = (w.emoji ? w.emoji + ' ' : '') + (w.name || 'Workout');
  $('#player').classList.add('open');
  document.body.style.overflow = 'hidden';
  if ($('#dlg').open) $('#dlg').close();
  keepAwake(true);
  enterStep(0);
  clearInterval(PL.tick); PL.tick = setInterval(tick, 200);
}
function enterStep(i) {
  PL.at = i; PL.sideSaid = false;
  const st = PL.steps[i];
  PL.left = st.secs; PL.endAt = Date.now() + st.secs * 1000;
  const e = EX[st.ex];
  if (st.kind === 'work') { beep(1046, 0.35); say(e.name + (e.sides ? '. First side.' : '')); }
  else if (st.kind === 'rest') {
    beep(523, 0.35);
    const prev = PL.steps[i - 1], chg = prev && EX[prev.ex].len !== e.len;
    say('Rest. Next: ' + e.name + (chg ? '. Straps to ' + D.LENGTHS[e.len].name : ''));
  } else say('Get ready. ' + e.name + '. Straps ' + D.LENGTHS[e.len].name);
  drawPlayer();
}
function tick() {
  if (!PL.running) return;
  const st = PL.steps[PL.at];
  const left = Math.max(0, Math.ceil((PL.endAt - Date.now()) / 1000));
  if (left !== PL.left) {
    if (left > 0 && left <= 3) beep(660, 0.1);
    if (st.kind === 'work') PL.done += PL.left - left;
    PL.left = left;
    // one-side-at-a-time moves: switch sides halfway through
    if (st.kind === 'work' && EX[st.ex].sides && !PL.sideSaid && left <= Math.floor(st.secs / 2)) {
      PL.sideSaid = true; beep(880, 0.2); setTimeout(() => beep(880, 0.2), 250); say('Switch sides');
    }
    drawPlayer();
  }
  if (left <= 0) {
    if (PL.at < PL.steps.length - 1) enterStep(PL.at + 1); else finish();
  }
}
function drawPlayer() {
  if (PL.finished) return;
  const st = PL.steps[PL.at], e = EX[st.ex];
  const listLen = (PL.w.list || []).filter(id => EX[id]).length;
  const prevWork = PL.steps.slice(0, PL.at).reverse().find(s => s.kind === 'work');
  const strapNote = st.kind !== 'work' && (!prevWork || EX[prevWork.ex].len !== e.len)
    ? `<div class="pl-strap">📏 Straps: ${esc(D.LENGTHS[e.len].name)} · ${esc(D.POSITIONS[e.pos])}</div>` : '';
  const nextWork = PL.steps.slice(PL.at + 1).find(s => s.kind === 'work');
  const label = { ready: 'GET READY', work: 'WORK', rest: st.between ? 'ROUND REST' : 'REST' }[st.kind];
  const sideNote = st.kind === 'work' && e.sides ? `<div class="pl-side">${PL.sideSaid ? '🔄 Second side' : '1️⃣ First side, switch halfway'}</div>` : '';
  $('#plMain').innerHTML = `
    <span class="pl-phase ${st.kind}">${label}${PL.running ? '' : ' · PAUSED'}</span>
    <div class="pl-time">${clock(PL.left)}</div>
    <div class="pl-where">Round ${st.round} of ${PL.w.rounds} · exercise ${st.i + 1} of ${listLen}</div>
    <div class="pl-ex">${st.kind === 'work' ? '' : 'Next: '}${esc(e.name)}</div>
    ${strapNote}${sideNote}
    <div class="pl-pic pic">${pic(e.id, e.name)}</div>
    <div class="pl-cue">${esc(st.kind === 'work' ? e.cues[0] : e.setup)}</div>
    ${st.kind === 'work' && nextWork ? `<div class="pl-next">Then: ${esc(EX[nextWork.ex].name)}</div>` : ''}`;
  const doneSecs = PL.steps.slice(0, PL.at).reduce((s, x) => s + x.secs, 0) + (st.secs - PL.left);
  $('#plBar').style.width = (100 * doneSecs / PL.steps.reduce((s, x) => s + x.secs, 0)) + '%';
  $('#plPlay').textContent = PL.running ? '⏸' : '▶';
  $('#plPlay').title = PL.running ? 'Pause' : 'Carry on';
  $('#plSound').setAttribute('aria-pressed', SOUND); $('#plVoice').setAttribute('aria-pressed', VOICE);
}
function pause(on) {
  if (on && PL.running) { PL.running = false; PL.left = Math.max(0, Math.ceil((PL.endAt - Date.now()) / 1000)); }
  else if (!on && !PL.running) { PL.running = true; PL.endAt = Date.now() + PL.left * 1000; }
  drawPlayer();
}
function closePlayer() {
  clearInterval(PL.tick); PL.running = false;
  try { speechSynthesis.cancel(); } catch (e) { /* fine */ }
  keepAwake(false);
  $('#player').classList.remove('open');
  document.body.style.overflow = '';
  render();
}
function logIt(partial) {
  const w = PL.w;
  const secs = partial ? PL.done : totalSecs(w);
  store.add('log', Object.assign({ name: w.name || 'Workout', emoji: w.emoji || '💪', wid: w.id || null, secs, date: dayKey(new Date()) }, partial ? { partial: true } : {}));
}
function finish() {
  clearInterval(PL.tick); PL.running = false; PL.finished = true;
  beep(784, 0.2); setTimeout(() => beep(1046, 0.4), 220);
  say('Workout done. Great job!');
  logIt(false);
  $('#plBar').style.width = '100%';
  $('#plMain').innerHTML = `
    <span class="pl-phase done">DONE</span>
    <div style="font-size:4rem">🎉</div>
    <div class="pl-ex">Nice work, ${esc(Family.me())}!</div>
    <div class="pl-where">${esc(PL.w.name || 'Workout')} · ${mins(totalSecs(PL.w))} · saved to the log</div>
    <div class="row" style="justify-content:center;margin-top:10px">
      <button class="btn" id="plLog">📈 See the log</button>
      <button class="btn ghost" id="plClose">Close</button>
    </div>`;
  $('#plPlay').textContent = '↺'; $('#plPlay').title = 'Do it again';
  $('#plLog').onclick = () => { TAB = 'log'; local.set('tab', 'log'); closePlayer(); };
  $('#plClose').onclick = closePlayer;
  keepAwake(false);
}
$('#plPlay').onclick = () => {
  if (PL.finished) { startWorkout(PL.w); return; }   // "do it again"
  pause(PL.running);
};
$('#plSkip').onclick = () => {
  if (PL.finished) return;
  if (PL.at < PL.steps.length - 1) enterStep(PL.at + 1); else finish();
  if (!PL.running && !PL.finished) { PL.running = true; pause(true); }   // stay paused if you were
};
$('#plBack').onclick = () => {
  if (PL.finished) return;
  // first tap restarts this step; a quick second tap goes back one
  const st = PL.steps[PL.at];
  if (st && PL.left >= st.secs - 2 && PL.at > 0) enterStep(PL.at - 1); else enterStep(PL.at);
  if (!PL.running) { PL.running = true; pause(true); }
};
$('#plQuit').onclick = () => {
  if (PL.finished) { closePlayer(); return; }
  pause(true);
  if (!confirm('Stop this workout?')) { pause(false); return; }
  if (PL.done >= 60 && confirm('Save what you did (' + mins(PL.done) + ') to the log?')) logIt(true);
  closePlayer();
};
$('#plSound').onclick = () => { SOUND = !SOUND; local.set('sound', SOUND); drawPlayer(); };
$('#plVoice').onclick = () => { VOICE = !VOICE; local.set('voice', VOICE); if (!VOICE) try { speechSynthesis.cancel(); } catch (e) { /* fine */ } drawPlayer(); };
document.addEventListener('keydown', ev => {
  if (!$('#player').classList.contains('open')) return;
  if (ev.target.closest('button') && (ev.key === ' ' || ev.key === 'Enter')) return;   // the button handles it
  if (ev.key === ' ') { ev.preventDefault(); $('#plPlay').click(); }
  if (ev.key === 'ArrowRight') $('#plSkip').click();
  if (ev.key === 'ArrowLeft') $('#plBack').click();
  if (ev.key === 'Escape') $('#plQuit').click();
});

render();
</script>
</body>
</html>
